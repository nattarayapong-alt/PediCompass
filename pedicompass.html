function mgEmpiricSection(ageGroup){
  if(ageGroup==='lt1m'){
    return { drugs:[
      {name:'Cefotaxime', dose:{th:'100–150 มก./กก./วัน แบ่งให้ทุก 8–12 ชม. (อายุ 0–7 วัน) หรือ 150–200 มก./กก./วัน แบ่งให้ทุก 6–8 ชม. (อายุ 8–28 วัน)', en:'100–150 mg/kg/day q8–12h (age 0–7 days), or 150–200 mg/kg/day q6–8h (age 8–28 days)'}}
    ], extra:[
      {th:'พิจารณาให้ Aminoglycoside (เช่น Amikacin, Gentamicin) ร่วมด้วยตามความเหมาะสม', en:'Consider adding an aminoglycoside (e.g. amikacin, gentamicin) as appropriate'},
      {th:'พิจารณาเพิ่ม Ampicillin หากย้อมสีกรัมพบ gram-positive bacilli หรือสงสัยเชื้อ Listeria monocytogenes (ประเทศไทยพบเชื้อนี้น้อย)', en:'Consider adding ampicillin if Gram stain shows gram-positive bacilli, or Listeria monocytogenes is suspected (uncommon in Thailand)'},
      {th:'อายุ &lt;1 เดือน ให้เลือกใช้ third-generation cephalosporin เป็น cefotaxime เท่านั้น (หลีกเลี่ยง ceftriaxone)', en:'For age &lt;1 month, use cefotaxime as the third-generation cephalosporin of choice (avoid ceftriaxone)'}
    ] };
  }
  return { drugs:[
    {name:'Cefotaxime หรือ Ceftriaxone', dose:{th:'Cefotaxime 225–300 มก./กก./วัน แบ่งให้ทุก 6–8 ชม. หรือ Ceftriaxone 100 มก./กก./วัน แบ่งให้ทุก 12–24 ชม.', en:'Cefotaxime 225–300 mg/kg/day q6–8h, or ceftriaxone 100 mg/kg/day q12–24h'}}
  ], extra:[
    {th:'พิจารณาเพิ่ม Vancomycin (60 มก./กก./วัน แบ่งให้ทุก 6 ชม.) หากย้อมสีกรัมพบ gram-positive diplococci, ตรวจ latex agglutination พบเชื้อ S. pneumoniae, มีปัจจัยเสี่ยงเชื้อดื้อยา (เช่น เคยได้ยากลุ่มเบต้าแลคแตมมาก่อนในช่วง 2 เดือนที่ผ่านมา) หรือมีอาการรุนแรง เช่น shock', en:'Consider adding vancomycin (60 mg/kg/day q6h) if Gram stain shows gram-positive diplococci, latex agglutination is positive for S. pneumoniae, there are risk factors for resistant pneumococcus (e.g. recent beta-lactam use within 2 months), or the illness is severe (e.g. shock)'},
    {th:'ปรับยาตามผลย้อมสีกรัม เพาะเชื้อ และความไวต่อยาเมื่อทราบผล (ดูตารางยาตามเชื้อด้านล่าง)', en:'Adjust based on Gram stain, culture, and susceptibility results once available (see organism-specific table below)'}
  ] };
}

let mgState = { screen:'intro', age:null, under2mo:null, lpct:[], csf:null, riskFactors:[] };
function mgResetAll(){ mgState = { screen:'intro', age:null, under2mo:null, lpct:[], csf:null, riskFactors:[] }; }
function mgGoTo(s){ mgState.screen=s; scrollToTop(); render(); }

function mgHeader(app, title){
  const head = document.createElement('div');
  head.className='wizard-head';
  head.innerHTML = `<div class="wizard-title">${title}</div>`;
  app.appendChild(head);
}

function mgRender(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const backBtn = document.createElement('button');
  backBtn.className='top-back-link';
  backBtn.textContent = t(UI.backToMainHome);
  backBtn.onclick = goMainHome;
  app.appendChild(backBtn);

  const order = ['intro','age','age2mo','lpct','ctInfo','csf','riskCheck','result'];
  const idx = order.indexOf(mgState.screen);
  if(idx>0 && idx<order.length-1){
    const track = document.createElement('div');
    track.className='progress-track';
    track.innerHTML = `<div class="progress-fill" style="width:${Math.round((idx/(order.length-2))*100)}%"></div>`;
    app.appendChild(track);
  }

  if(mgState.screen==='intro') mgIntroView(app);
  else if(mgState.screen==='age') mgAgeView(app);
  else if(mgState.screen==='age2mo') mgAge2moView(app);
  else if(mgState.screen==='lpct') mgLpctView(app);
  else if(mgState.screen==='ctInfo') mgCtInfoView(app);
  else if(mgState.screen==='csf') mgCsfView(app);
  else if(mgState.screen==='riskCheck') mgRiskCheckView(app);
  else if(mgState.screen==='result') mgResultView(app);
}

function mgLpctView(app){
  mgHeader(app, t(MG.refBadge));
  const card = document.createElement('div');
  card.className='q-card';
  card.innerHTML = `
    <div class="q-text">${t(MG.lpct.heading)}</div>
    <div class="q-hint">${t(MG.lpct.hint)}</div>
    <div class="opt-list">
      ${MG.lpct.items.map(it=>{
        const sel = mgState.lpct.includes(it.key) ? 'selected':'';
        return `<button class="opt-btn ${sel}" data-val="${it.key}"><span class="chk">${sel?'✓':''}</span>${t(it.label)}</button>`;
      }).join('')}
    </div>
    <div class="wizard-nav">
      <button class="btn btn-ghost" id="mgBack">${t(UI.back)}</button>
      <button class="btn btn-primary" id="mgNext" ${mgState.lpct.length>0?'':'disabled'}>${t(UI.next)}</button>
    </div>
  `;
  app.appendChild(card);
  card.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const val = btn.getAttribute('data-val');
      let arr = mgState.lpct;
      if(val==='none'){ arr = arr.includes('none') ? [] : ['none']; }
      else { arr = arr.filter(v=>v!=='none'); if(arr.includes(val)) arr = arr.filter(v=>v!==val); else arr = arr.concat([val]); }
      mgState.lpct = arr; render();
    };
  });
  document.getElementById('mgBack').onclick = ()=>mgGoTo(mgState.age==='m1_3' ? 'age2mo' : 'age');
  document.getElementById('mgNext').onclick = ()=>{
    const { ctNeeded, lpContra } = mgLpCtFlags();
    // If LP is contraindicated, there will be no CSF result to interpret — clear any previously
    // selected CSF answer and skip straight to the result (empiric treatment) screen.
    if(lpContra){ mgState.csf = null; mgGoTo('result'); }
    // If CT is indicated first (and LP itself isn't contraindicated), show the CT guidance screen
    // before letting the user proceed to enter a CSF result.
    else if(ctNeeded){ mgGoTo('ctInfo'); }
    else { mgGoTo('csf'); }
  };
}

            <ul style="margin:4px 0 0; padding-left:16px; font-size:12px; color:var(--ink-soft); line-height:1.6; font-weight:400;">${bullets}</ul>
          </span>
        </button>`;
      }).join('')}
    </div>
    <div class="wizard-nav">
      <button class="btn btn-ghost" id="mgBack">${t(UI.back)}</button>
      <button class="btn btn-primary" id="mgNext" ${mgState.csf?'':'disabled'}>${t(UI.next)}</button>
    </div>
  `;
  app.appendChild(card);
  card.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.onclick = ()=>{ mgState.csf = btn.getAttribute('data-val'); render(); };
  });
  document.getElementById('mgBack').onclick = ()=>{
    const { ctNeeded } = mgLpCtFlags();
    mgGoTo(ctNeeded ? 'ctInfo' : 'lpct');
  };
  document.getElementById('mgNext').onclick = ()=>{
    // Bacterial CSF already implies empiric antibiotics — no need for the extra risk-factor
    // screen. Normal/non-bacterial results still need it, since certain risk factors warrant
    // antibiotics even when CSF doesn't look bacterial.
    mgGoTo(mgState.csf==='bacterial' ? 'result' : 'riskCheck');
  };
}

function mgRiskCheckView(app){
  mgHeader(app, t(MG.refBadge));
  const card = document.createElement('div');
  card.className='q-card';
  card.innerHTML = `
    <div class="q-text">${t(MG.riskFactors.heading)}</div>
    <div class="q-hint">${t(MG.riskFactors.hint)}</div>
    <div class="opt-list">
      ${MG.riskFactors.items.map(it=>{
        const sel = mgState.riskFactors.includes(it.key) ? 'selected':'';
        return `<button class="opt-btn ${sel}" data-val="${it.key}"><span class="chk">${sel?'✓':''}</span>${t(it.label)}</button>`;
      }).join('')}
    </div>
    <div class="wizard-nav">
      <button class="btn btn-ghost" id="mgBack">${t(UI.back)}</button>
      <button class="btn btn-primary" id="mgNext" ${mgState.riskFactors.length>0?'':'disabled'}>${t(UI.seeResult)}</button>
    </div>
  `;
  app.appendChild(card);
  card.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const val = btn.getAttribute('data-val');
      let arr = mgState.riskFactors;
      if(val==='none'){ arr = arr.includes('none') ? [] : ['none']; }
      else { arr = arr.filter(v=>v!=='none'); if(arr.includes(val)) arr = arr.filter(v=>v!==val); else arr = arr.concat([val]); }
      mgState.riskFactors = arr; render();
    };
  });
  document.getElementById('mgBack').onclick = ()=>mgGoTo('csf');
  document.getElementById('mgNext').onclick = ()=>mgGoTo('result');
}

function mgLpCtFlags(){
  const ctNeeded = mgState.lpct.some(k => (MG.lpct.items.find(it=>it.key===k)||{}).ct);
  const lpContra = mgState.lpct.some(k => (MG.lpct.items.find(it=>it.key===k)||{}).lpContra);
  return { ctNeeded, lpContra };
}

function mgCompute(){
  const ageLabel = t(MG.ageGroupLabel[mgState.age]);
  const { ctNeeded, lpContra } = mgLpCtFlags();
  const sections = [];

  // ---------- 1. LP / CT guidance ----------
  // Only shown when LP is contraindicated (no CSF result — essential context for the summary).
  // The "CT needed" and "no restrictions, LP fine" cases were already communicated on their own
  // screens earlier in the wizard, so nothing is repeated here for those.
  if(lpContra){
    sections.push({ icon:'⛔', h:{th:'มีข้อห้ามของการเจาะน้ำไขสันหลัง — ไม่ทราบผล CSF', en:'LP contraindicated — no CSF result available'}, prominent:true, list:[
      {th:'พบข้อห้ามของการเจาะน้ำไขสันหลัง จึงไม่สามารถทำ LP และไม่ทราบผล CSF ได้ในขณะนี้', en:'A contraindication to LP is present, so LP cannot be performed and no CSF result is available now'},
      {th:'ให้เริ่มยาปฏิชีวนะแบบครอบคลุม (empiric) ทันทีตามอาการทางคลินิก โดยไม่ต้องรอผล CSF (ดูคำแนะนำด้านล่าง)', en:'Start empiric antibiotics immediately based on clinical findings, without waiting for a CSF result (see recommendation below)'},
      ctNeeded ? {th:'ควรพิจารณาทำ CT scan สมองเมื่อสภาพผู้ป่วยเอื้ออำนวย เพื่อประเมินโครงสร้างสมองเพิ่มเติม', en:'Consider brain CT when feasible to further assess intracranial structure'} : {th:'', en:''},
      {th:'พิจารณาเจาะน้ำไขสันหลังภายหลังเมื่อสภาพผู้ป่วยดีขึ้นหรือข้อห้ามหมดไป', en:'Consider LP later once the patient stabilizes or the contraindication resolves'}
    ].filter(x=>t(x)) });
  }

  let severity, title, summary;

  // Split into pieces so acyclovir (when indicated) can be interleaved right after the empiric
  // antibiotics section, ahead of dexamethasone and the reference tables.
  function pushEmpiricAbx(){
    const emp = mgEmpiricSection(mgState.age);
    sections.push({ icon:'💉', h:{th:'ยาปฏิชีวนะเบื้องต้น (Empiric)', en:'Empiric antibiotics'}, prominent:true, drugs:emp.drugs, extra:emp.extra });
  }

  function pushDexaAndTables(){
    // Dexamethasone is only recommended when the CSF result itself is consistent with bacterial
    // infection (not for the LP-contraindicated/no-CSF pathway, and not for normal/non-bacterial
    // CSF even when antibiotics are still being considered as a safety net) — and never for
    // infants younger than 1 month.
    if(mgState.age!=='lt1m' && mgState.csf==='bacterial'){
      sections.push({ icon:'💊', h:{th:'Dexamethasone (adjunctive)', en:'Dexamethasone (adjunctive)'}, prominent:true,
        drugs:[ {name:'Dexamethasone', dose:{th:'0.15 มก./กก./ครั้ง ทางหลอดเลือดดำ ทุก 6 ชั่วโมง', en:'0.15 mg/kg/dose IV every 6 hours'}} ],
        extra:[
          {th:'สำหรับเด็กอายุมากกว่า 1 เดือนขึ้นไปเท่านั้น (WHO 2025)', en:'For infants and children older than 1 month only (WHO 2025)'},
          {th:'ให้พร้อมกับหรือก่อนยาปฏิชีวนะเข็มแรกเล็กน้อย และภายใน 12 ชั่วโมงหลังได้ยาปฏิชีวนะเข็มแรก ในผู้ป่วยที่สงสัย/น่าจะ/ยืนยันเยื่อหุ้มสมองอักเสบจากเชื้อแบคทีเรีย (WHO 2025)', en:'Give with, or shortly before, the first dose of antibiotics — and no later than 12 hours after the first dose — in patients with suspected, probable, or confirmed bacterial meningitis (WHO 2025)'},
          {th:'ให้ทางหลอดเลือดดำในสถานพยาบาลที่รับผู้ป่วยไว้ (WHO 2025)', en:'Administer intravenously in an inpatient setting (WHO 2025)'},
          {th:'ให้ต่อเนื่องนานสูงสุด 4 วัน หากผล CSF เข้าได้กับเยื่อหุ้มสมองอักเสบจากเชื้อแบคทีเรีย หากผล CSF ไม่เข้าได้กับแบคทีเรีย ควรหยุดยา (WHO 2025)', en:'Continue for a maximum of 4 days if CSF is consistent with bacterial meningitis; discontinue if CSF is not consistent with a bacterial cause (WHO 2025)'}
        ] });
    }

    sections.push({ icon:'📋', h:{th:'ตารางยาปฏิชีวนะตามเชื้อที่สงสัย', en:'Antibiotic choice by suspected organism'}, collapsible:true, openByDefault:false, customHtml: mgOrganismTableHtml() });
    sections.push({ icon:'📋', h:{th:'ตารางขนาดยาปฏิชีวนะโดยละเอียด', en:'Detailed antibiotic dosing table'}, collapsible:true, openByDefault:false, customHtml: mgDoseTableHtml() });
    sections.push({ icon:'📋', h:{th:'ตารางระยะเวลาการให้ยาปฏิชีวนะตามเชื้อ', en:'Antibiotic duration by organism'}, collapsible:true, openByDefault:false, customHtml: mgDurationTableHtml() });
  }

  // Reusable block: empiric antibiotics + dexamethasone + reference tables, in that order — used
  // for the pathways where acyclovir consideration doesn't apply (bacterial CSF, no-CSF/LP
  // -contraindicated pathway).
  function pushBacterialTreatment(includeAcyclovir){
    pushEmpiricAbx();
    if(includeAcyclovir && acyclovirIndicated) pushAcyclovirSection();
    pushDexaAndTables();
  }

  // Risk factors that justify antibiotics even when CSF is normal or non-bacterial: age <3
  // months, the "severe illness / uncontrolled seizure" LP-contraindication finding, or DIC /
  // clinical-lab suspicion of concurrent bacterial infection from the risk-factor screen.
  const ageUnder3mo = (mgState.age==='lt1m' || mgState.age==='m1_3');
  const rf = mgState.riskFactors || [];
  const additionalAbxIndicated = ageUnder3mo || mgState.lpct.includes('unstable') || rf.includes('dic') || rf.includes('bacterial_suspicion');
  function additionalAbxReasons(){
    const reasons = [];
    if(ageUnder3mo) reasons.push({th:'อายุน้อยกว่า 3 เดือน', en:'age under 3 months'});
    if(mgState.lpct.includes('unstable')) reasons.push({th:'อาการรุนแรง (cardiovascular instability หรือชักที่ควบคุมได้ยาก)', en:'severe illness (cardiovascular instability or refractory seizures)'});
    if(rf.includes('dic')) reasons.push({th:'มีภาวะ DIC', en:'DIC'});
    if(rf.includes('bacterial_suspicion')) reasons.push({th:'อาการทางคลินิก/ผลตรวจ lab สงสัยติดเชื้อแบคทีเรียร่วมด้วย', en:'clinical/lab findings suggestive of concurrent bacterial infection'});
    return reasons.map(r=>t(r)).join(' · ');
  }

  // Criteria that indicate acyclovir even when CSF is normal or non-bacterial: HSV-suggestive
  // features, severely impaired consciousness (captured on the LP/CT screen), difficult-to-control
  // seizures, worsening consciousness with unexplained fever/focal seizure/neuro abnormality, or
  // age under 2 months (age <1 month always qualifies; for the 1–3 month bracket, only if the
  // follow-up question confirms under 2 months).
  const acyclovirAgeCriterion = (mgState.age==='lt1m') || (mgState.age==='m1_3' && mgState.under2mo===true);
  const acyclovirIndicated = rf.includes('hsv_skin') || mgState.lpct.includes('consciousness') || rf.includes('seizure_uncontrolled') || rf.includes('worsening_unclear') || acyclovirAgeCriterion;
  function acyclovirReasons(){
    const reasons = [];
    if(rf.includes('hsv_skin')) reasons.push({th:'มีอาการเข้าได้กับ HSV encephalitis (skin lesion)', en:'features consistent with HSV encephalitis (skin lesion)'});
    if(mgState.lpct.includes('consciousness')) reasons.push({th:'ระดับความรู้สึกตัวลดลงรุนแรง (ซึม)', en:'severely decreased consciousness (lethargy)'});
    if(rf.includes('seizure_uncontrolled')) reasons.push({th:'ชักที่ควบคุมได้ยาก', en:'seizures difficult to control'});
    if(rf.includes('worsening_unclear')) reasons.push({th:'ระดับความรู้สึกตัวแย่ลงร่วมกับไข้/ชักเฉพาะที่/ความผิดปกติทางระบบประสาทที่ยังหาสาเหตุอื่นไม่ได้', en:'worsening consciousness with fever/focal seizure/neurological abnormality of unclear cause'});
    if(acyclovirAgeCriterion) reasons.push({th:'อายุน้อยกว่า 2 เดือน', en:'age under 2 months'});
    return reasons.map(r=>t(r)).join(' · ');
  }
  function pushAcyclovirSection(){
    if(acyclovirIndicated){
      sections.push({ icon:'💊', h:{th:'แนะนำให้ Acyclovir', en:'Acyclovir recommended'}, prominent:true, list:[
        {th:`เข้าเกณฑ์ต้องพิจารณาให้ acyclovir: ${acyclovirReasons()}`, en:`Meets criteria for acyclovir: ${acyclovirReasons()}`},
        {th:'เริ่ม acyclovir ทางหลอดเลือดดำโดยเร็ว ตามขนาดยาที่เหมาะสมกับอายุ (ดูตารางขนาดยาด้านล่าง)', en:'Start IV acyclovir promptly, dosed by age (see dosing table below)'}
      ] });
    }
    sections.push({ icon:'📋', h:{th:'เกณฑ์และขนาดยา Acyclovir (อ้างอิง)', en:'Acyclovir criteria and dosing (reference)'}, collapsible:true, openByDefault:false, customHtml:
      `<div style="font-weight:600; font-size:12.5px; margin:2px 0 4px; color:var(--ink);">${LANG==='th'?'เกณฑ์การพิจารณา (ตารางที่ 7)':'Criteria (Table 7)'}</div>
       ${mgAcyclovirCriteriaTableHtml()}
       <div style="font-weight:600; font-size:12.5px; margin:14px 0 4px; color:var(--ink);">${LANG==='th'?'ขนาดยา (ตารางที่ 8)':'Dosing (Table 8)'}</div>
       ${mgAcyclovirDoseTableHtml()}` });
  }

  if(lpContra){
    // LP could not be performed at all — no CSF result to interpret, so treat empirically now.
    severity = 'severe';
    title = {th:'มีข้อห้ามของการเจาะน้ำไขสันหลัง — เริ่มยาปฏิชีวนะแบบครอบคลุม', en:'LP contraindicated — start empiric antibiotics'};
    summary = {th:`${ageLabel} — ไม่สามารถเจาะน้ำไขสันหลังได้ในขณะนี้ ให้เริ่มการรักษาตามอาการทางคลินิกทันที`, en:`${ageLabel} — LP cannot be performed now; start treatment based on clinical findings immediately`};
    pushBacterialTreatment(true);
  } else if(mgState.csf==='normal'){
    if(additionalAbxIndicated){
      severity = 'moderate';
      title = {th:'ผล CSF ปกติ แต่มีความเสี่ยง — ควรพิจารณาให้ยาปฏิชีวนะ', en:'Normal CSF but risk factors — antibiotics should be considered'};
      summary = {th:`${ageLabel} — ผล CSF ปกติ แต่เข้าเกณฑ์ปัจจัยเสี่ยง (${additionalAbxReasons()}) จึงควรพิจารณาให้ยาปฏิชีวนะจนกว่าจะได้วินิจฉัยที่ชัดเจน`, en:`${ageLabel} — CSF is normal, but the following risk factor(s) are present (${additionalAbxReasons()}), so antibiotics should be considered until a clear diagnosis is reached`};
      sections.push({ icon:'👁️', h:{th:'แนวทางการดูแล', en:'Management'}, list:[
        {th:'เฝ้าสังเกตอาการอย่างใกล้ชิด และหาสาเหตุอื่นของอาการร่วมด้วย', en:'Observe closely and investigate other causes of symptoms as well'},
        {th:'Re-evaluate ภายใน 24 ชั่วโมง', en:'Re-evaluate within 24 hours'}
      ] });
      pushEmpiricAbx();
      if(acyclovirIndicated) pushAcyclovirSection();
      pushDexaAndTables();
    } else {
      severity = 'mild';
      title = {th:'ผล CSF ปกติ', en:'Normal CSF result'};
      summary = {th:'ไม่เข้าเกณฑ์เยื่อหุ้มสมองอักเสบจากผล CSF ปัจจุบัน — เฝ้าสังเกตอาการและหาสาเหตุอื่น', en:'Current CSF result does not meet meningitis criteria — observe and investigate other causes'};
      sections.push({ icon:'👁️', h:{th:'แนวทางการดูแล', en:'Management'}, list:[
        {th:'เฝ้าสังเกตอาการอย่างใกล้ชิด และหาสาเหตุอื่นของอาการ (เช่น Mycoplasma, Rickettsia infection) และให้การรักษาตามความเหมาะสม', en:'Observe closely and investigate other causes of symptoms (e.g. Mycoplasma, Rickettsia infection), treating as appropriate'},
        {th:'Re-evaluate ภายใน 24 ชั่วโมง หากอาการไม่ดีขึ้นหรือแย่ลง ให้พิจารณาเจาะน้ำไขสันหลังซ้ำ', en:'Re-evaluate within 24 hours — if not improving or worsening, consider repeat lumbar puncture'}
      ] });
      if(acyclovirIndicated) pushAcyclovirSection();
    }
  } else if(mgState.csf==='nonbacterial'){
    severity = additionalAbxIndicated ? 'severe' : (acyclovirIndicated ? 'severe' : 'moderate');
    title = additionalAbxIndicated
      ? {th:'สงสัยไวรัส/สาเหตุอื่น แต่มีความเสี่ยง — ควรพิจารณาให้ยาปฏิชีวนะ', en:'Suspected non-bacterial but risk factors — antibiotics should be considered'}
      : {th:'สงสัยเยื่อหุ้มสมอง/สมองอักเสบจากไวรัสหรือสาเหตุอื่น', en:'Suspected viral or other non-bacterial meningoencephalitis'};
    summary = additionalAbxIndicated
      ? {th:`${ageLabel} — ผล CSF เข้าได้กับไวรัส แต่เข้าเกณฑ์ปัจจัยเสี่ยง (${additionalAbxReasons()}) จึงควรพิจารณาให้ยาปฏิชีวนะจนกว่าจะได้วินิจฉัยที่ชัดเจน`, en:`${ageLabel} — CSF suggests a viral cause, but the following risk factor(s) are present (${additionalAbxReasons()}), so antibiotics should be considered until a clear diagnosis is reached`}
      : {th:`${ageLabel} — ผล CSF เข้าได้กับเชื้อไวรัสหรือสาเหตุที่ไม่ใช่แบคทีเรีย`, en:`${ageLabel} — CSF consistent with a viral or non-bacterial cause`};
    sections.push({ icon:'🦠', h:{th:'แนวทางการดูแล', en:'Management'}, list:[
      {th:'เฝ้าสังเกตอาการใกล้ชิด ให้การรักษาตามสาเหตุที่พบ (เช่น Mycoplasma, Rickettsia infection) ตามความเหมาะสม', en:'Observe closely; treat any identified cause (e.g. Mycoplasma, Rickettsia infection) as appropriate'},
      {th:'Re-evaluate ภายใน 24 ชั่วโมง', en:'Re-evaluate within 24 hours'}
    ] });
    if(additionalAbxIndicated){
      pushEmpiricAbx();
      pushAcyclovirSection();
      pushDexaAndTables();
    } else {
      pushAcyclovirSection();
    }
  } else { // bacterial
    severity = 'severe';
    title = {th:'สงสัยเยื่อหุ้มสมองอักเสบจากเชื้อแบคทีเรีย', en:'Suspected bacterial meningitis'};
    summary = {th:`${ageLabel} — ผล CSF เข้าได้กับเชื้อแบคทีเรีย ควรเริ่มยาปฏิชีวนะแบบครอบคลุมทันที`, en:`${ageLabel} — CSF consistent with bacterial infection; start empiric antibiotics immediately`};
    pushBacterialTreatment();
  }

  return { severity, title, summary, sections };
}

function mgResultView(app){
  mgHeader(app, t(MG.refBadge));
  const wrap = document.createElement('div');
  const result = mgCompute();

  const banner = document.createElement('div');
  banner.className = `result-banner ${result.severity}`;
  banner.innerHTML = `<h2>${t(result.title)}</h2><p>${t(result.summary)}</p>`;
  wrap.appendChild(banner);

  (result.sections||[]).forEach(sec=>{
    const sc = document.createElement('div');
    sc.className = sec.prominent ? 'section-card prominent' : 'section-card';
    let body = sec.customHtml || '';
    if(sec.drugs && sec.drugs.length){ body += sec.drugs.map(d=>`<div class="drugline"><span class="dname">${d.name}</span><span class="ddose">${t(d.dose)}</span></div>`).join(''); }
    if(sec.extra && sec.extra.length){ body += `<ul>${sec.extra.map(e=>`<li>${t(e)}</li>`).join('')}</ul>`; }
    if(sec.list && sec.list.length){ body += `<ul>${sec.list.map(e=>`<li>${t(e)}</li>`).join('')}</ul>`; }
    if(sec.collapsible){
      sc.innerHTML = `<details ${sec.openByDefault?'open':''}>
        <summary style="cursor:pointer; font-size:13.5px; font-weight:600; color:var(--pink-600); list-style:none; display:flex; align-items:center; gap:7px;">${sec.icon||''} ${t(sec.h)} <span style="margin-left:auto; font-size:11px; color:var(--ink-soft); font-weight:400;">${LANG==='th'?'แตะเพื่อดูรายละเอียด':'tap for details'}</span></summary>
        <div style="margin-top:10px;">${body}</div>
      </details>`;
    } else {
      const headSize = sec.prominent ? '15px' : '13.5px';
      sc.innerHTML = `<h3 style="font-size:${headSize};">${sec.icon||''} ${t(sec.h)}</h3>${body}`;
    }
    wrap.appendChild(sc);
  });

  const restart = document.createElement('button');
  restart.className='restart-btn';
  restart.textContent = t(UI.restart);
  restart.onclick = ()=>{ mgResetAll(); scrollToTop(); render(); };
  wrap.appendChild(restart);

  const ref = document.createElement('div');
  ref.className='ref-note';
  ref.textContent = t(MG.refFooter);
  wrap.appendChild(ref);

  app.appendChild(wrap);
}

/* ============================================================================
   PEDIATRIC SEPSIS / SEPTIC SHOCK MODULE (SP)
   - แนวทางเวชปฏิบัติการวินิจฉัยและรักษาผู้ป่วยเด็กติดเชื้อในกระแสเลือดแบบรุนแรง
     และแบบที่มีภาวะช็อก พ.ศ. 2561 (สมาคมโรคระบบหายใจและเวชบำบัดวิกฤตในเด็กแห่ง
     ประเทศไทย ร่วมกับราชวิทยาลัยกุมารแพทย์แห่งประเทศไทย)
   - Surviving Sepsis Campaign International Guidelines for the Management of
     Sepsis and Septic Shock in Children 2026 (Weiss SL, et al. Pediatr Crit
     Care Med 2026;27:379-434)
   ขอบเขต: เด็กอายุมากกว่า 1 เดือน (ทารกแรกเกิด <28 วัน ใช้โมดูล Early Onset
   Neonatal Sepsis แทน)
   ============================================================================ */

      hepatic:{th:'ติดตาม coagulation profile และหลีกเลี่ยงยาที่มีผลต่อตับโดยไม่จำเป็น', en:'Monitor coagulation profile and avoid unnecessary hepatotoxic medications'},
      neuro:{th:'ประเมิน GCS ซ้ำเป็นระยะ ระวังภาวะ increased intracranial pressure', en:'Reassess GCS serially; watch for signs of increased intracranial pressure'}
    },

    fluidHeading:{th:'Fluid Resuscitation (ชั่วโมงแรก)', en:'Fluid resuscitation (first hour)'},
    fluidBase:{th:'IV/IO access ให้เร็วที่สุด (พิจารณาทำ intraosseous หากเปิดเส้นเลือดดำไม่ได้ภายใน 90 วินาทีในผู้ป่วย profound shock) ให้ balanced crystalloid (Ringer\u2019s lactate/acetate) bolus 10-20 มล./กก. ใน 15-20 นาที — หากไม่มี balanced crystalloid ให้ใช้ 0.9% NSS แทนได้ ประเมินซ้ำทุกครั้ง (ฟังปอด-หัวใจ คลำตับ) ก่อนให้ครั้งถัดไป', en:'Establish IV/IO access as fast as possible (consider intraosseous if IV access fails within 90 sec in profound shock). Give balanced crystalloid (Ringer\u2019s lactate/acetate) bolus 10-20 mL/kg over 15-20 min — if balanced crystalloid is unavailable, 0.9% NSS may be used instead, reassessing (lung/heart auscultation, liver palpation) before each further bolus.'},
    fluidIcuYes:{th:'มี ICU รองรับ — สามารถให้สารน้ำซ้ำได้จนถึง 40-60 มล./กก. ในชั่วโมงแรก หากยังไม่มีสัญญาณ fluid overload (Thai CPG 2561 + SSC 2026)', en:'ICU available — fluid boluses may be repeated up to 40-60 mL/kg in the first hour if no signs of fluid overload (Thai CPG 2018 + SSC 2026)'},
    fluidIcuNo:{th:'ไม่มี ICU รองรับ — ให้สารน้ำได้สูงสุด 40 มล./กก. ในชั่วโมงแรก (bolus ละ 10-20 มล./กก.) แล้วรีบส่งต่อโรงพยาบาลที่มี ICU (SSC 2026)', en:'No ICU available — give up to a maximum of 40 mL/kg in the first hour (10-20 mL/kg per bolus), then refer promptly to a facility with ICU capability (SSC 2026)'},
    fluidStop:{th:'หยุดให้สารน้ำ bolus เพิ่มเมื่อ: มีสัญญาณ fluid overload (ปอดมีเสียง crepitation, ตับโตขึ้น, หายใจเหนื่อยมากขึ้น) หรือภาวะ hypoperfusion หายไปแล้ว', en:'Stop further fluid boluses when: signs of fluid overload appear (crackles, worsening hepatomegaly, increased work of breathing), or hypoperfusion has resolved'},

    vasoHeading:{th:'ยากระตุ้นความดันเลือด (Vasoactive medications)', en:'Vasoactive medications'},
    vasoIntro:{th:'พิจารณาเริ่มเมื่อยังมีภาวะช็อกหลังให้สารน้ำ (fluid refractory shock) สามารถเริ่มผ่านทาง peripheral vein หรือ IO ได้เลย ไม่ต้องรอ central line', en:'Consider starting when shock persists despite fluid resuscitation (fluid-refractory shock). May be initiated through peripheral or IO access — no need to wait for central venous access.'},
    vasoFirstLine:{th:'First-line: เลือกใช้ epinephrine หรือ norepinephrine อย่างใดอย่างหนึ่ง — SSC 2026 ไม่ได้ระบุว่าตัวใดควรเป็น first-line ที่ชัดเจนกว่ากัน (insufficient evidence) ขึ้นกับความพร้อมของยาและดุลยพินิจทางคลินิก ไม่จำเป็นต้องแยกตามชนิด cold/warm shock', en:'First-line: either epinephrine or norepinephrine may be used — SSC 2026 found insufficient evidence to prefer one over the other, so the choice depends on drug availability and clinical judgment; distinguishing cold vs warm shock is not required.'},
    vasoDoseHeading:{th:'ตารางที่ 6: ยาที่ใช้ในการรักษาภาวะ Septic Shock', en:'Table 6: Medications for septic shock'},

    escHeading:{th:'Escalation เมื่อยังมีภาวะช็อก (Catecholamine-resistant / Refractory)', en:'Escalation when shock persists (catecholamine-resistant / refractory)'},
    escItems:[
      {th:'Catecholamine-resistant shock (ยังช็อกแม้ได้ epinephrine 0.3 มคก./กก./นาที หรือ norepinephrine 0.1 มคก./กก./นาที หรือ dopamine 10 มคก./กก./นาที): เพิ่ม vasopressin หรือ titrate catecholamine ต่อ', en:'Catecholamine-resistant shock (persists despite epinephrine 0.3 mcg/kg/min, norepinephrine 0.1 mcg/kg/min, or dopamine 10 mcg/kg/min): add vasopressin or continue titrating catecholamines'},
      {th:'หากความดันปกติแต่ cardiac index <3.3 ลิตร/นาที/ตร.ม. หรือสงสัย cardiac dysfunction: พิจารณา dobutamine 5-20 มคก./กก./นาที หรือ milrinone 0.25-0.75 มคก./กก./นาที', en:'If BP is normal but cardiac index <3.3 L/min/m² or cardiac dysfunction suspected: consider dobutamine 5-20 mcg/kg/min or milrinone 0.25-0.75 mcg/kg/min'},
      {th:'พิจารณา hydrocortisone หากมี fluid-refractory catecholamine-resistant shock หรือมีความเสี่ยง adrenal insufficiency: loading 50 มก./ตร.ม. IV แล้วตามด้วย 50-100 มก./ตร.ม./วัน แบ่งให้ทุก 6 ชม.', en:'Consider hydrocortisone for fluid-refractory catecholamine-resistant shock or risk of adrenal insufficiency: 50 mg/m² IV loading, then 50-100 mg/m²/day divided every 6 hr'},
      {th:'Refractory shock (แม้ได้ inotrope/vasopressor/vasodilator ครบแล้ว): พิจารณา venoarterial ECMO ในสถานที่ที่ทำได้ และให้รีบส่งต่อหากไม่มี', en:'Refractory shock (despite full inotrope/vasopressor/vasodilator support): consider venoarterial ECMO where available, and refer urgently if not'}
    ],

    airwayHeading:{th:'การใส่ท่อช่วยหายใจ (ถ้าจำเป็น)', en:'Intubation (if required)'},
    airwayItems:[
      {th:'ยาที่แนะนำ: ketamine 0.5-2 มก./กก. ± atropine 0.02 มก./กก. (ลดผลต่อ hemodynamic)', en:'Preferred agents: ketamine 0.5-2 mg/kg ± atropine 0.02 mg/kg (minimal hemodynamic effect)'},

      {th:'เตรียมสารน้ำและยากระตุ้นความดันเลือดให้พร้อมก่อนใส่ท่อ เนื่องจากอาจเกิดความดันเลือดต่ำระหว่างหัตถการ', en:'Have fluids and vasoactive agents ready before intubation, as hypotension may occur peri-procedure'}
    ],

    adjunctHeading:{th:'Adjuncts เพิ่มเติม', en:'Additional adjuncts'},
    adjunctItems:[
      {th:'เลือด (PRBC): ให้ 10 มล./กก. หากอาการไม่คงที่และ Hb <10 ก./ดล. หรืออาการคงที่และ Hb <7 ก./ดล.', en:'PRBC: transfuse 10 mL/kg if hemodynamically unstable with Hb <10 g/dL, or stable with Hb <7 g/dL'},
      {th:'เกร็ดเลือด: ให้เมื่อ <50,000/ลบ.มม.ร่วมกับ active bleeding/ต้องทำหัตถการ, <20,000 ในผู้ป่วยเสี่ยงเลือดออกง่าย, หรือ <10,000 ในทุกราย', en:'Platelets: transfuse when <50,000/mm³ with active bleeding/procedure planned, <20,000 in patients at bleeding risk, or <10,000 in all patients'},
      {th:'ควบคุมระดับน้ำตาลในเลือดให้อยู่ระหว่าง 80-180 มก./ดล.', en:'Target blood glucose 80-180 mg/dL'},
      {th:'พิจารณา renal replacement therapy หากมี AKI stage 2-3, severe metabolic acidosis ที่ไม่ตอบสนองต่อยา, หรือ hyperkalemia ที่มี ECG เปลี่ยนแปลง', en:'Consider renal replacement therapy for AKI stage 2-3, severe medication-refractory metabolic acidosis, or hyperkalemia with ECG changes'},

/* ---------- State ---------- */
function spInitialForm(){
  return {
    riskFactors:[],
    ageBand:null,
    sirs:[],
    organ:{ cv:false, resp:false, neuro:false, heme:false, renal:false, hepatic:false },
    icuAvailable:null,
    shockType:'cold'
  };
}
let spState = { screen:'screening', form: spInitialForm() };
function spResetAll(){ spState = { screen:'screening', form: spInitialForm() }; }
function spGoTo(s){ spState.screen = s; scrollToTop(); render(); }

function spGetAgeBand(f){
  if(!f.ageBand) return null;
  return SP.screening.ageBands.find(b=>b.key===f.ageBand) || null;
}

function spSirsPass(sirs){
  if(sirs.length < 2) return false;
  return sirs.includes('temp') || sirs.includes('wbc');
}

/* Per SSC 2026, the grouping is binary: "Probable Sepsis" (no shock) vs "Suspected Septic
   Shock". Any severe-sepsis-level organ dysfunction (CV dysfunction, ARDS, or ≥2 organ systems)
   is treated as suspected septic shock and gets the full shock management pathway.
   spSeverity() keeps the finer distinction (none/severe/cv) only for banner wording —
   spClassify() collapses it to the two treatment pathways: 'sepsis' | 'shock'. */
function spSeverity(f){
  const o = f.organ;
  const organCount = Object.values(o).filter(Boolean).length;
  if(o.cv) return 'cv';
  if(o.resp || organCount>=2) return 'severe';
  return 'none';
}
function spClassify(f){
  return spSeverity(f)==='none' ? 'sepsis' : 'shock';
}

/* ---------- Shared header ---------- */
function spHeader(app, title){
  const head = document.createElement('div');
  head.className='wizard-head';
  head.innerHTML = `<div class="wizard-title">${title}</div>`;
  app.appendChild(head);
}

/* ---------- Render ---------- */
function spRender(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const backBtn = document.createElement('button');
  backBtn.className='top-back-link';
  backBtn.textContent = t(UI.backToMainHome);
  backBtn.onclick = goMainHome;
  app.appendChild(backBtn);

  if(spState.screen==='screening') spScreeningView(app);
  else if(spState.screen==='notSepsis') spNotSepsisView(app);
  else if(spState.screen==='organ') spOrganView(app);
  else if(spState.screen==='icu') spIcuView(app);
  else if(spState.screen==='result') spResultView(app);
}

/* ---------- Step 1: Screening (SIRS-based) ---------- */
function spVitalTable(){
  const c = SP.screening.vitalTableCols;
  const rows = SP.screening.ageBands.map(b=>{
    const bradyTxt = b.brady===null ? 'NA' : `&lt; ${b.brady}`;
    return `<tr><td>${t(b.label)}</td><td>&gt; ${b.tachy}</td><td>${bradyTxt}</td><td>&gt; ${b.rr}</td><td>&gt; ${b.wbcHi} ${LANG==='th'?'หรือ':'or'} &lt; ${b.wbcLo}</td><td>&lt; ${b.sbp}</td></tr>`;
  }).join('');
  return `<div class="dose-table-scroll"><table class="dose-table"><thead><tr><th>${t(c.age)}</th><th>${t(c.tachy)}</th><th>${t(c.brady)}</th><th>${t(c.rr)}</th><th>${t(c.wbc)}</th><th>${t(c.sbp)}</th></tr></thead><tbody>${rows}</tbody></table></div><p style="font-size:10.5px; color:var(--ink-soft); margin:6px 2px 0;">${t(SP.screening.vitalTableSource)}</p>`;
}

function spSirsLabels(band){
  let hrLabel, rrLabel, wbcLabel;
  if(band){
    hrLabel = band.brady===null
      ? t(SP.screening.sirsItems[1].labelTplNoBrady).replace('{tachy}', band.tachy)
      : t(SP.screening.sirsItems[1].labelTplBrady).replace('{tachy}', band.tachy).replace('{brady}', band.brady);
    rrLabel = t(SP.screening.sirsItems[2].labelTpl).replace('{rr}', band.rr);
    wbcLabel = t(SP.screening.sirsItems[3].labelTpl).replace('{wbcHi}', band.wbcHi).replace('{wbcLo}', band.wbcLo);
  } else {
    hrLabel = t(SP.screening.sirsItems[1].labelGeneric);
    rrLabel = t(SP.screening.sirsItems[2].labelGeneric);
    wbcLabel = t(SP.screening.sirsItems[3].labelGeneric);
  }
  return { hrLabel, rrLabel, wbcLabel };
}

function spScreeningView(app){
  spHeader(app, t(SP.refBadge));
  const f = spState.form;
  const band = spGetAgeBand(f);

  const scope = document.createElement('div');
  scope.className='scope-note';
  scope.textContent = t(SP.scopeNote);
  app.appendChild(scope);

  const card = document.createElement('div');
  card.className='q-card';

  const { hrLabel, rrLabel, wbcLabel } = spSirsLabels(band);

  card.innerHTML = `
    <div class="q-text">${t(SP.screening.ageHeading)}</div>
    <div class="q-hint">${t(SP.screening.ageHint)}</div>
    <div class="opt-list">
      ${SP.screening.ageBands.map(b=>{
        const sel = f.ageBand===b.key ? 'selected':'';
        return `<button class="opt-btn radio ${sel}" data-grp="age" data-val="${b.key}"><span class="chk">${sel?'✓':''}</span>${t(b.label)}</button>`;
      }).join('')}
    </div>
    <details style="margin-top:10px;">
      <summary style="cursor:pointer; font-size:12px; color:var(--pink-600);">${t(SP.screening.vitalTableToggle)}</summary>
      <div style="margin-top:8px;">${spVitalTable()}</div>
    </details>

    <div class="q-text" style="margin-top:20px;">${t(SP.screening.riskHeading)}</div>
    <div class="q-hint">${t(SP.screening.riskHint)}</div>
    <div class="opt-list">
      ${SP.screening.riskItems.map(it=>{
        const sel = f.riskFactors.includes(it.key) ? 'selected':'';
        return `<button class="opt-btn ${sel}" data-grp="risk" data-val="${it.key}"><span class="chk">${sel?'✓':''}</span>${t(it.label)}</button>`;
      }).join('')}
    </div>

    <div class="q-text" style="margin-top:20px;">${t(SP.screening.sirsHeading)}</div>
    <div class="q-hint">${t(SP.screening.sirsHint)}</div>
    <div class="opt-list">
      <button class="opt-btn ${f.sirs.includes('temp')?'selected':''}" data-grp="sirs" data-val="temp"><span class="chk">${f.sirs.includes('temp')?'✓':''}</span>${t(SP.screening.sirsItems[0].label)}</button>
      <button class="opt-btn ${f.sirs.includes('hr')?'selected':''}" data-grp="sirs" data-val="hr"><span class="chk">${f.sirs.includes('hr')?'✓':''}</span>${hrLabel}</button>
      <button class="opt-btn ${f.sirs.includes('rr')?'selected':''}" data-grp="sirs" data-val="rr"><span class="chk">${f.sirs.includes('rr')?'✓':''}</span>${rrLabel}</button>
      <button class="opt-btn ${f.sirs.includes('wbc')?'selected':''}" data-grp="sirs" data-val="wbc"><span class="chk">${f.sirs.includes('wbc')?'✓':''}</span>${wbcLabel}</button>
    </div>

    <div class="wizard-nav">
      <button class="btn btn-primary" id="spNext" ${f.ageBand?'':'disabled'}>${t(UI.next)}</button>
    </div>
  `;
  app.appendChild(card);

  card.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const grp = btn.getAttribute('data-grp');
      const val = btn.getAttribute('data-val');
      if(grp==='age'){
        f.ageBand = val;
      } else if(grp==='risk'){
        f.riskFactors = f.riskFactors.includes(val) ? f.riskFactors.filter(v=>v!==val) : f.riskFactors.concat([val]);
      } else if(grp==='sirs'){
        f.sirs = f.sirs.includes(val) ? f.sirs.filter(v=>v!==val) : f.sirs.concat([val]);
      }
      render();
    };
  });

  const nextBtn = document.getElementById('spNext');
  if(nextBtn){
    nextBtn.onclick = ()=>{
      spGoTo(spSirsPass(f.sirs) ? 'organ' : 'notSepsis');
    };
  }
}

function spNotSepsisView(app){
  spHeader(app, t(SP.refBadge));
  const wrap = document.createElement('div');
  const banner = document.createElement('div');
  banner.className = 'result-banner info';
  banner.innerHTML = `<h2>${t(SP.screening.notMetTitle)}</h2><p>${t(SP.screening.notMetSummary)}</p>`;
  wrap.appendChild(banner);

  const restart = document.createElement('button');
  restart.className='restart-btn';

/* ---------- Result + management ---------- */
function spScrollHint(){
  return `<div style="font-size:10px; color:var(--ink-soft); margin-top:2px;">${LANG==='th'?'◀︎ เลื่อนตารางซ้าย-ขวาเพื่อดูข้อมูลเพิ่มเติม ▶︎':'◀︎ Scroll table left-right for more ▶︎'}</div>`;
}

/* Generic scrollable dose-table renderer: cols is an ordered array of {key, label}, rows is an
   array of plain objects keyed the same way. Cell values may be a bilingual {th,en} object or a
   plain string (drug/organism names are kept language-neutral). */
function spTableHtml(cols, rows, footer){
  const headHtml = cols.map(c=>`<th>${t(c.label)}</th>`).join('');
  const bodyHtml = rows.map(r=>{
    const cells = cols.map(c=>{
      const v = r[c.key];
      const txt = (v && typeof v==='object' && (v.th!==undefined || v.en!==undefined)) ? t(v) : (v||'');
      return `<td>${txt}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
  let html = `<div class="dose-table-scroll"><table class="dose-table"><thead><tr>${headHtml}</tr></thead><tbody>${bodyHtml}</tbody></table></div>${spScrollHint()}`;
  if(footer) html += `<div style="font-size:11px; color:var(--ink-soft); margin-top:6px;">${t(footer)}</div>`;
  return html;
}

function spHypotensionTableHtml(hypo){
  const cols = [{key:'age',label:hypo.cols.age},{key:'sbp',label:hypo.cols.sbp}];
  return spTableHtml(cols, hypo.rows, hypo.source);
}

function spAbxTablesHtml(){
  const T = SP.tables;
  const cols3 = [{key:'age',label:T.t3Cols.age},{key:'pathogen',label:T.t3Cols.pathogen},{key:'abx',label:T.t3Cols.abx},{key:'note',label:T.t3Cols.note}];
  const cols4 = [{key:'cond',label:T.t4Cols.cond},{key:'pathogen',label:T.t4Cols.pathogen},{key:'abx',label:T.t4Cols.abx},{key:'note',label:T.t4Cols.note}];
  const cols5 = [{key:'drug',label:T.t5Cols.drug},{key:'dose',label:T.t5Cols.dose},{key:'freq',label:T.t5Cols.freq},{key:'adult',label:T.t5Cols.adult},{key:'note',label:T.t5Cols.note}];
  return `
    <div style="margin-bottom:16px;">
      <div style="font-size:12.5px; font-weight:600; margin-bottom:6px;">${t(T.t3Heading)}</div>
      ${spTableHtml(cols3, T.t3Rows, T.t3Footer)}
    </div>
    <div style="margin-bottom:16px;">
      <div style="font-size:12.5px; font-weight:600; margin-bottom:6px;">${t(T.t4Heading)}</div>
      ${spTableHtml(cols4, T.t4Rows, null)}
    </div>
    <div>
      <div style="font-size:12.5px; font-weight:600; margin-bottom:6px;">${t(T.t5Heading)}</div>
      ${spTableHtml(cols5, T.t5Rows, T.t5Footer)}
    </div>
  `;
}

function spVasoTableHtml(){
  const T = SP.tables;
  const cols = [{key:'drug',label:T.t6Cols.drug},{key:'dose',label:T.t6Cols.dose},{key:'indication',label:T.t6Cols.indication},{key:'grade',label:T.t6Cols.grade}];
  return spTableHtml(cols, T.t6Rows, T.t6Footer);
}

function spSedationTableHtml(){
  const T = SP.tables;
  const cols = [{key:'drug',label:T.t7Cols.drug},{key:'dose',label:T.t7Cols.dose},{key:'note',label:T.t7Cols.note},{key:'grade',label:T.t7Cols.grade}];
  return spTableHtml(cols, T.t7Rows, null);
}

function spFigureHtml(){
  return `<img src="${SP.figure.dataUri}" alt="${t(SP.figure.caption)}" style="width:100%; height:auto; border-radius:8px; border:0.5px solid var(--pink-200); display:block;">
    <div style="font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.5;">${t(SP.figure.caption)}</div>`;
}

function spSectionCard(wrap, opts){
  const sc = document.createElement('div');
  sc.className = opts.prominent ? 'section-card prominent' : 'section-card';
  let body = opts.customHtml || '';
  if(opts.drugs && opts.drugs.length){ body += opts.drugs.map(d=>`<div class="drugline"><span class="dname">${t(d.name)}</span><span class="ddose">${t(d.dose)}</span></div>`).join(''); }
  if(opts.list && opts.list.length){ body += `<ul>${opts.list.map(e=>`<li>${t(e)}</li>`).join('')}</ul>`; }
  if(opts.collapsible){
    sc.innerHTML = `<details ${opts.openByDefault?'open':''}>
      <summary style="cursor:pointer; font-size:13.5px; font-weight:600; color:var(--pink-600); list-style:none; display:flex; align-items:center; gap:7px;">${opts.icon||''} ${t(opts.h)} <span style="margin-left:auto; font-size:11px; color:var(--ink-soft); font-weight:400;">${LANG==='th'?'แตะเพื่อดูรายละเอียด':'tap for details'}</span></summary>
      <div style="margin-top:10px;">${body}</div>
    </details>`;
  } else {
    const headSize = opts.prominent ? '15px' : '13.5px';
    sc.innerHTML = `<h3 style="font-size:${headSize};">${opts.icon||''} ${t(opts.h)}</h3>${body}`;
  }
  wrap.appendChild(sc);
}

function spResultView(app){
  spHeader(app, t(SP.refBadge));
  const f = spState.form;
  const wrap = document.createElement('div');
  const cls = spClassify(f);
  const sev = spSeverity(f);
  const organCount = Object.values(f.organ).filter(Boolean).length;

  const bannerSev = sev==='none' ? 'mild' : 'severe';
  const banner = document.createElement('div');
  banner.className = `result-banner ${bannerSev}`;
  const title = sev==='cv' ? SP.res.shockTitle : (sev==='severe' ? SP.res.suspectedShockTitle : SP.res.sepsisTitle);
  const summary = sev==='cv' ? SP.res.shockSummary : (sev==='severe' ? SP.res.suspectedShockSummary : SP.res.sepsisSummary);
  banner.innerHTML = `<h2>${t(title)}</h2><p>${t(summary)}</p>`;
  wrap.appendChild(banner);

  /* SSC 2026 quick-guide algorithm — collapsible reference image */
  spSectionCard(wrap, { h:SP.figure.toggle, icon:'🗺️', collapsible:true, customHtml: spFigureHtml() });

  if(cls==='sepsis' && organCount===1){
    const note = document.createElement('div');
    note.className='section-card';
    note.innerHTML = `<p style="font-size:12.5px; color:var(--ink-soft); margin:0;">${t(SP.res.oneOrganNote)}</p>`;
    wrap.appendChild(note);
  }

  /* Antibiotics / culture / lactate — all classifications */
  const atbText = cls==='shock' ? SP.res.atbShock : SP.res.atbSepsis;
  spSectionCard(wrap, { h:SP.res.bundleHeading, icon:'💉', prominent:true, list:[atbText, SP.res.cultureLine, SP.res.lactateLine, SP.res.sourceLine] });

  /* Antibiotic reference tables 3-5, collapsible for all classifications */
  spSectionCard(wrap, { h:SP.tables.abxToggle, icon:'📋', collapsible:true, customHtml: spAbxTablesHtml() });

  if(cls==='sepsis'){
    spSectionCard(wrap, { h:SP.res.supportHeading, icon:'🩺', list:SP.res.sepsisSupport });
  }

  if(cls==='shock'){
    /* Fluid */
    const fluidList = [SP.res.fluidBase, f.icuAvailable ? SP.res.fluidIcuYes : SP.res.fluidIcuNo, SP.res.fluidStop];
    spSectionCard(wrap, { h:SP.res.fluidHeading, icon:'💧', prominent:true, list:fluidList });

    /* Vasoactive — SSC 2026: epinephrine or norepinephrine, no cold/warm distinction required */
    spSectionCard(wrap, { h:SP.res.vasoHeading, icon:'💊', prominent:true, list:[SP.res.vasoIntro, SP.res.vasoFirstLine] });
    spSectionCard(wrap, { h:SP.res.vasoDoseHeading, icon:'📋', collapsible:true, customHtml: spVasoTableHtml() });

    /* Escalation */
    spSectionCard(wrap, { h:SP.res.escHeading, icon:'⬆️', collapsible:true, openByDefault:true, list:SP.res.escItems });

    /* Airway */
    spSectionCard(wrap, { h:SP.res.airwayHeading, icon:'🫁', collapsible:true, list:SP.res.airwayItems });
    spSectionCard(wrap, { h:SP.res.sedationDoseHeading, icon:'📋', collapsible:true, customHtml: spSedationTableHtml() });

    /* Organ-specific tips for any non-CV system also checked */
    const organTipsList = [];
    SP.organ.systems.forEach(sys=>{
      if(sys.key!=='cv' && f.organ[sys.key] && SP.res.organTips[sys.key]) organTipsList.push(SP.res.organTips[sys.key]);
    });
    if(organTipsList.length){
      spSectionCard(wrap, { h:SP.res.organTipsHeading, icon:'🩺', collapsible:true, list:organTipsList });
    }

    spSectionCard(wrap, { h:SP.res.adjunctHeading, icon:'➕', collapsible:true, list:SP.res.adjunctItems });
  }

  const restart = document.createElement('button');
  restart.className='restart-btn';
  restart.textContent = t(UI.restart);
  restart.onclick = ()=>{ spResetAll(); scrollToTop(); render(); };
  wrap.appendChild(restart);

  const ref = document.createElement('div');
  ref.className='ref-note';
  ref.textContent = t(SP.refFooter);
  wrap.appendChild(ref);

  app.appendChild(wrap);
}

    en:'This tool is intended to support the clinical decision-making of healthcare professionals, based on (1) Puopolo KM, Benitz WE, Zaoutis TE. Management of Neonates Born at ≤34 6/7 Weeks’ Gestation With Suspected or Proven Early-Onset Bacterial Sepsis. Pediatrics 2018 (American Academy of Pediatrics) and (2) the Neonatal Early Onset Sepsis (EOS) Guideline of the Division of Neonatology, Department of Pediatrics, Ramathibodi Hospital, for infants ≥35 weeks’ gestation, used together with the Neonatal Early-Onset Sepsis Calculator (Kaiser Permanente).'
  },
  sepsis:{
    th:'เครื่องมือนี้จัดทำขึ้นเพื่อสนับสนุนการตัดสินใจทางคลินิกของบุคลากรทางการแพทย์ โดยอ้างอิง (1) แนวทางเวชปฏิบัติการวินิจฉัยและรักษาผู้ป่วยเด็กติดเชื้อในกระแสเลือดแบบรุนแรงและแบบที่มีภาวะช็อก พ.ศ. 2561 คณะอนุกรรมการกุมารเวชบำบัดวิกฤตแห่งประเทศไทย และ (2) Surviving Sepsis Campaign International Guidelines for the Management of Sepsis and Septic Shock in Children 2026',
    en:'This tool is intended to support the clinical decision-making of healthcare professionals, based on (1) the Clinical Practice Guideline for Management of Pediatric Severe Sepsis and Septic Shock 2018 (Pediatric Critical Care Subcommittee of Thailand) and (2) the Surviving Sepsis Campaign International Guidelines for the Management of Sepsis and Septic Shock in Children 2026.'
  }
};

const FOOTER_WARNING = {
  th:'เครื่องมือนี้ไม่สามารถทดแทนดุลยพินิจทางคลินิกของแพทย์ผู้ดูแลผู้ป่วยได้ ผู้ป่วยแต่ละรายมีรายละเอียดแตกต่างกัน การตัดสินใจรักษาขึ้นกับดุลยพินิจของแพทย์ในสถานการณ์ขณะนั้น และควรปรึกษาผู้เชี่ยวชาญเฉพาะทางเมื่อจำเป็น',
  en:'This tool does not replace the clinical judgment of the treating physician. Every patient differs in detail; treatment decisions remain at the discretion of the attending physician at the time of care, and specialist consultation is recommended when appropriate.'
};

function updateFooterDisclaimer(){
  const el = document.getElementById('footer-disclaimer');
  const warnEl = document.getElementById('footer-disclaimer-warning');
  if(el){
    // On the main home screen, skip the long combined reference list — it's clutter here
    // since each module already shows its own specific reference once opened.
    const showRef = topState.screen!=='home';
    el.textContent = showRef ? t(CATEGORY_DISCLAIMERS[topState.screen] || CATEGORY_DISCLAIMERS.home) : '';
    el.style.display = showRef ? '' : 'none';
  }
  if(warnEl){
    warnEl.textContent = t(FOOTER_WARNING);
  }
}

/* ============================================================================
   TOP-LEVEL APP ROUTER (main home + 4 categories: respiratory / fever / syphilis / diarrhea)
   ============================================================================ */
let topState = { screen:'home' };

function goMainHome(){
  topState = { screen:'home' };
  scrollToTop();
  render();
}

function selectCategory(cat){
  topState = { screen: cat };
  if(cat==='respiratory'){ rsGoHome(); }
  else if(cat==='fever'){ fvResetAll(); }
  else if(cat==='syphilis'){ syResetAll(); }
  else if(cat==='diarrhea'){ drResetAll(); }
  else if(cat==='eos'){ eoResetAll(); }
  else if(cat==='meningoencephalitis'){ mgResetAll(); }
  else if(cat==='sepsis'){ spResetAll(); }
  scrollToTop();
  render();
}

const CATEGORIES = [
  { id:'fever', icon:'🌡️', name:{th:'Fever Without Source', en:'Fever Without Source'}, short:{th:'อายุ 0–3 ปี · ประเมินความเสี่ยง SBI', en:'Age 0–3y · SBI risk assessment'} },
  { id:'respiratory', icon:'🫁', name:{th:'Respiratory Tract Infections', en:'Respiratory Tract Infections'}, short:{th:'หูชั้นกลาง · ไซนัส · Croup · ปอดบวม', en:'AOM · Sinusitis · Croup · Pneumonia'} },
  { id:'diarrhea', icon:'💧', name:{th:'Acute Diarrhea', en:'Acute Diarrhea'}, short:{th:'ประเมินภาวะขาดน้ำและการรักษา', en:'Dehydration assessment & management'} },
  { id:'meningoencephalitis', icon:'🧠', name:{th:'Meningoencephalitis', en:'Meningoencephalitis'}, short:{th:'ประเมิน LP · ผล CSF · ยาปฏิชีวนะ', en:'LP work-up · CSF result · antibiotics'} },
  { id:'sepsis', icon:'🚨', name:{th:'Sepsis / Septic Shock', en:'Sepsis / Septic Shock'}, short:{th:'คัดกรอง · แยกระดับความรุนแรง · แผนการรักษา', en:'Screen · classify severity · management plan'} },
  { id:'syphilis', icon:'👶', name:{th:'Congenital Syphilis', en:'Congenital Syphilis'}, short:{th:'ประเมินและรักษาทารกแรกเกิด', en:'Newborn evaluation & treatment'} },
  { id:'eos', icon:'🍼', name:{th:'Early Onset Neonatal Sepsis', en:'Early Onset Neonatal Sepsis'}, short:{th:'ทารกสงสัยติดเชื้อในกระแสเลือดแรกเกิด', en:'Newborn with suspected early-onset sepsis'} }
];

function renderMainHome(app){
  const hero = document.createElement('div');
  hero.innerHTML = `
    <div class="hero">
      <span class="eyebrow" data-i18n="mainHomeEyebrow">${t(UI.mainHomeEyebrow)}</span>
      <h1 data-i18n="mainHomeTitle">${t(UI.mainHomeTitle)}</h1>
      <p data-i18n="mainHomeDesc">${t(UI.mainHomeDesc)}</p>
    </div>
  `;
  app.appendChild(hero);
  const grid = document.createElement('div');
  grid.className = 'module-grid';
  CATEGORIES.forEach(cat=>{
    const card = document.createElement('button');
    card.className='module-card';
    card.onclick = ()=>selectCategory(cat.id);
    card.innerHTML = `
      <div class="icon">${cat.icon}</div>
      <div class="txt">
        <div class="name">${t(cat.name)}</div>
        <div class="desc">${t(cat.short)}</div>
      </div>
      <div class="arrow">›</div>`;
    grid.appendChild(card);
  });
  app.appendChild(grid);
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  updateFooterDisclaimer();
  if(topState.screen==='home'){ renderMainHome(app); return; }
  if(topState.screen==='respiratory'){ rsRender(); return; }
  if(topState.screen==='fever'){ fvRender(); return; }
  if(topState.screen==='syphilis'){ syRender(); return; }
  if(topState.screen==='diarrhea'){ drRender(); return; }
  if(topState.screen==='eos'){ eoRender(); return; }
  if(topState.screen==='meningoencephalitis'){ mgRender(); return; }
  if(topState.screen==='sepsis'){ spRender(); return; }
}

render();
</script>
