<style>
:root{
  --pink-50:#F4FAFF;
  --pink-100:#E6F2FC;
  --pink-200:#D2E7F8;
  --pink-300:#ABD2EF;
  --pink-400:#7BB6E3;
  --pink-500:#4F93CE;
  --pink-600:#3A6EA5;
  --pink-700:#2A527D;
  --ink:#1B3A54;
  --ink-soft:#5B7C93;
  --white:#FFFFFF;
  --mild-bg:#E5F5E7; --mild-bd:#9FD3A8; --mild-tx:#2E6B3A;
  --mod-bg:#FFF1DA; --mod-bd:#F0BC72; --mod-tx:#8A5A0E;
  --sev-bg:#FDE1E4; --sev-bd:#EF9AA3; --sev-tx:#9C2B37;
  --info-bg:#E9F1FB; --info-bd:#A9C7EC; --info-tx:#2C5480;
  --radius:18px;
  --shadow: 0 6px 24px rgba(184,84,128,0.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(180deg, var(--pink-50) 0%, #FBFDFF 40%);
  color:var(--ink);
  font-family:'Sarabun','IBM Plex Mono',sans-serif;
  min-height:100vh;
  display:flex; flex-direction:column;
}
h1,h2,h3,.display{font-family:'Taviraj','Sarabun',serif; font-weight:600;}
.mono{font-family:'IBM Plex Mono',monospace;}

header.top{
  padding:18px 20px 14px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--pink-200);
  background:rgba(255,255,255,0.7);
  backdrop-filter: blur(6px);
  position:sticky; top:0; z-index:20;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand .logo{
  width:38px; height:38px; border-radius:12px;
  background:linear-gradient(135deg,var(--pink-400),var(--pink-600));
  display:flex; align-items:center; justify-content:center;
  color:white; font-family:'Taviraj',serif; font-weight:700; font-size:18px;
  flex-shrink:0;
}
.brand-text{line-height:1.15;}
.brand-text .title{font-size:15px; font-weight:600; color:var(--ink);}

/* Scroll the new page/step to the top. Call this on every page-change (Next/Back/GoTo/Home/Restart),

function scrollToTop(){ window.scrollTo(0,0); }
function setLang(l){
  LANG = l;

  document.getElementById('btn-en').classList.toggle('active', l==='en');

let rsState = { screen:'home', moduleId:null, step:0, answers:{} };

function rsGoHome(){ rsState = { screen:'home', moduleId:null, step:0, answers:{} }; scrollToTop(); rsRender(); }
function rsOpenModule(id){ rsState = { screen:'wizard', moduleId:id, step:0, answers:{} }; scrollToTop(); rsRender(); }

/* ============================= MODULE DEFINITIONS ============================= */

function opt(value,label){ return {value, label}; }

      options:[ opt('recentabx',{th:'ได้รับยาต้านจุลชีพภายใน 3 เดือนที่ผ่านมา',en:'Received antibiotics within the past 3 months'}),
                opt('daycare',{th:'อยู่ในสถานรับเลี้ยงเด็กอ่อน',en:'Attends daycare'}),
                opt('none',{th:'ไม่มีปัจจัยเสี่ยงอื่นเพิ่มเติม',en:'No additional risk factors'}) ] },
    { key:'allergy', type:'select', text:{th:'ประวัติแพ้ยากลุ่ม Penicillin', en:'Penicillin allergy history'},
      options:[ opt('none',{th:'ไม่มีประวัติแพ้',en:'No known allergy'}),
                opt('mild',{th:'แพ้ชนิดไม่รุนแรง (ไม่ใช่ anaphylaxis/urticaria)',en:'Non-severe reaction (not anaphylaxis/urticaria)'}),
                opt('severe',{th:'แพ้รุนแรง (Anaphylaxis หรือ Urticaria)',en:'Severe reaction (anaphylaxis or urticaria)'}) ] }
  ],
  compute(a){
    if(a.diagnosis==='none'){
      return { severity:'info', title:{th:'ไม่เข้าเกณฑ์วินิจฉัย AOM',en:'Does not meet AOM diagnostic criteria'},
        summary:{th:'ไม่พบลักษณะน้ำในหูชั้นกลางหรือความผิดปกติของแก้วหูที่เข้าได้กับ AOM ควรพิจารณาการวินิจฉัยแยกโรคอื่น เช่น Otitis media with effusion (OME) หรือ Myringitis',
                 en:'No middle-ear effusion or TM findings consistent with AOM. Consider alternative diagnoses such as otitis media with effusion (OME) or myringitis.'},
        sections:[] };
    }
    // Per Diagram 4 (แผนภูมิที่ 4): age <2y OR severe symptoms -> treat now (skip observation).
    // Age ≥2y + non-severe -> observe 48-72h first.
    const observeFirst = (a.age==='o2' && a.severity==='mildnone');
    // DRSP risk per the flowchart's "ประเมิน risk DRSP" box: age <2y, recent antibiotics (3mo), or daycare.
    // NOTE: symptom severity does NOT affect this — it only affects treat-now vs observe-first.
    const otherRisk = a.risk && a.risk.filter(v=>v!=='none').length>0;
    const riskDRSP = (a.age==='u2') || otherRisk;
    const duration = (a.age==='u2' || a.severity==='severe')
      ? {th:'10 วัน', en:'10 days'} : {th:'5–7 วัน', en:'5–7 days'};

    // Build the tiered drug options per allergy status.
    let tier1 = null, tier2 = [], tier2Label, escalation;
    if(a.allergy==='none' || !a.allergy){
      tier1 = { name:'Amoxicillin', dose:{th:'40–50 มก./กก./วัน แบ่ง 2–3 เวลา', en:'40–50 mg/kg/day divided 2–3 doses'} };
      tier2 = [
        { name:'Amoxicillin (ขนาดสูง)', dose:{th:'80–90 มก./กก./วัน แบ่ง 2–3 เวลา', en:'80–90 mg/kg/day divided 2–3 doses'} },
        { name:'หรือ Cefuroxime', dose:{th:'30 มก./กก./วัน แบ่ง 2 เวลา', en:'30 mg/kg/day divided BID'} },
        { name:'หรือ Cefdinir', dose:{th:'14 มก./กก./วัน แบ่ง 2 เวลา', en:'14 mg/kg/day divided BID'} }
      ];
      escalation = { th:'หากอาการไม่ดีขึ้น พิจารณาเปลี่ยนเป็น IV/IM Ceftriaxone 75 มก./กก./วัน นาน 1–3 วัน และส่งปรึกษาแพทย์ ENT',
                     en:'If not improving, switch to IV/IM Ceftriaxone 75 mg/kg/day for 1–3 days and refer to ENT' };
    } else if(a.allergy==='mild'){
      tier2 = [
        { name:'Cefuroxime', dose:{th:'30 มก./กก./วัน แบ่ง 2 เวลา', en:'30 mg/kg/day divided BID'} },
        { name:'หรือ Cefdinir', dose:{th:'14 มก./กก./วัน แบ่ง 2 เวลา', en:'14 mg/kg/day divided BID'} },
        { name:'หรือ Cefditoren', dose:{th:'9–18 มก./กก./วัน แบ่ง 2 เวลา', en:'9–18 mg/kg/day divided BID'} }
      ];
      escalation = { th:'หากอาการไม่ดีขึ้น ส่งปรึกษาแพทย์ ENT (ระมัดระวัง cross-reactivity หากพิจารณา ceftriaxone)',
                     en:'If not improving, refer to ENT (use caution regarding cross-reactivity if considering ceftriaxone)' };
    } else if(a.allergy==='severe'){
      tier2 = [
        { name:'Azithromycin', dose:{th:'10 มก./กก./วัน วันแรก แล้ว 5 มก./กก./วัน วันละครั้ง อีก 4 วัน', en:'10 mg/kg/day on day 1, then 5 mg/kg/day once daily for 4 more days'} },
        { name:'หรือ Clarithromycin', dose:{th:'15 มก./กก./วัน แบ่ง 2 เวลา นาน 5–7 วัน', en:'15 mg/kg/day divided BID for 5–7 days'} },
        { name:'หรือ Erythromycin', dose:{th:'40–50 มก./กก./วัน แบ่ง 4 เวลา นาน 10 วัน', en:'40–50 mg/kg/day divided q6h for 10 days'} }
      ];
      escalation = { th:'หากอาการไม่ดีขึ้น ส่งปรึกษาแพทย์ ENT / กุมารแพทย์โรคติดเชื้อทันที (หลีกเลี่ยงการเปลี่ยนเป็นยากลุ่ม beta-lactam)',
                     en:'If not improving, refer to ENT / pediatric ID immediately (avoid switching to a beta-lactam)' };
    }

    // Determine what to actually start with.
    let startDrugs, startNote;
    if(tier1 && !riskDRSP){
      startDrugs = [tier1];
      startNote = { th:'ไม่มีปัจจัยเสี่ยง DRSP — เริ่มด้วยขนาดมาตรฐาน', en:'No DRSP risk factors — start at standard dose' };
    } else {
      startDrugs = tier2;
      startNote = tier1
        ? { th:'มีปัจจัยเสี่ยง DRSP (อายุ <2 ปี และ/หรือปัจจัยอื่นที่เลือกไว้) — เริ่มด้วยขนาดสูง/ยาทางเลือกทันที', en:'DRSP risk factor(s) present (age <2y and/or other selected factors) — start at high-dose/alternative agent directly' }
        : null;
    }

    let title, summary, sev;
    if(observeFirst){
      sev = 'mild';
      title = {th:'สังเกตอาการก่อน 48–72 ชั่วโมง', en:'Observe for 48–72 hours first'};
      summary = {th:'อายุ ≥2 ปี อาการปวดหูไม่รุนแรง — ให้ยาแก้ปวดและติดตามอาการก่อน หากดีขึ้นไม่ต้องให้ยาต้านจุลชีพ หากไม่ดีขึ้นให้เริ่มยาต้านจุลชีพตามปัจจัยเสี่ยง DRSP ด้านล่าง',
                  en:'Age ≥2y with non-severe ear pain — give analgesia and observe first. If improved, no antibiotics needed. If not improved, start antibiotics per the DRSP risk assessment below.'};
    } else {
      sev = a.severity==='severe' ? 'moderate' : 'mild';
      title = {th:'แนะนำให้ยาต้านจุลชีพทันที', en:'Antibiotics recommended now'};
      summary = {th: a.age==='u2' ? 'อายุน้อยกว่า 2 ปี ควรได้รับยาต้านจุลชีพทุกราย' : 'ปวดหูรุนแรง หรือไข้สูง — ควรเริ่มยาต้านจุลชีพทันที',
                  en: a.age==='u2' ? 'Age under 2 years — antibiotics recommended for all patients.' : 'Severe ear pain or high fever — start antibiotics now.'};
    }

    // Escalation section content depends on which tier the patient is starting at.
    let escSection;
    if(tier1 && !riskDRSP){
      // Starting at tier1 (standard-dose amoxicillin) — first step-up is to tier2, not straight to ceftriaxone.
      escSection = { icon:'🔁', h:{th:'หากอาการไม่ดีขึ้นภายใน 48–72 ชั่วโมง',en:'If not improved within 48–72 hours'},
        list:[ {th:'ปรับเป็นขนาดสูง/ยาทางเลือกดังนี้ ก่อนพิจารณาขั้นต่อไป', en:'Step up to the high-dose/alternative agent below before considering the next step'} ],
        drugs: tier2,
        extra:[ {th:'หากปรับยาแล้วยังไม่ดีขึ้นอีก ให้พิจารณาเปลี่ยนเป็น IV/IM Ceftriaxone 75 มก./กก./วัน นาน 1–3 วัน และส่งปรึกษาแพทย์ ENT', en:'If still not improved after stepping up, switch to IV/IM Ceftriaxone 75 mg/kg/day for 1–3 days and refer to ENT'} ] };
    } else {
      // Already starting at tier2 (risk factors present) or on an allergy substitute — next step is the final escalation.
      escSection = { icon:'🔁', h:{th:'หากอาการไม่ดีขึ้นภายใน 48–72 ชั่วโมง',en:'If not improved within 48–72 hours'},
        list:[ escalation ] };
    }

    const sections = [
      observeFirst ? { icon:'👁', h:{th:'ขั้นตอนแรก: สังเกตอาการ',en:'Step 1: Observe'}, list:[
          {th:'ให้ยาแก้ปวดลดไข้ และติดตามอาการ 48–72 ชั่วโมง โดยยังไม่ต้องให้ยาต้านจุลชีพ', en:'Give analgesia and observe for 48–72 hours without antibiotics'},
          {th:'อาการดีขึ้น: ไม่ต้องให้ยาต้านจุลชีพ', en:'If improved: no antibiotics needed'},
          {th:'อาการไม่ดีขึ้น: เริ่มยาต้านจุลชีพตามตารางด้านล่าง (ประเมินปัจจัยเสี่ยง DRSP)', en:'If not improved: start antibiotics per the table below (based on DRSP risk)'} ] } : null,
      { icon:'💊', h:{th: observeFirst ? 'หากอาการไม่ดีขึ้น — ยาต้านจุลชีพ' : 'ยาต้านจุลชีพ', en: observeFirst ? 'If not improved — antibiotic therapy' : 'Antibiotic therapy'},
        drugs: startDrugs, extra: startNote ? [startNote] : [] },
      { icon:'⏱', h:{th:'ระยะเวลาการรักษา',en:'Duration'}, list: a.allergy==='severe'
          ? [ {th:'ระยะเวลาให้ยาขึ้นกับชนิดยาที่เลือก ดังระบุไว้ในขนาดยาข้างต้น', en:'Duration depends on the specific drug chosen, as noted in the dosing above'} ]
          : [ {th:`ให้ยานาน ${duration.th}`, en:`Treat for ${duration.en}`} ] },
      escSection,
      { icon:'🩹', h:{th:'การรักษาตามอาการ',en:'Symptomatic care'}, list:[
          {th:'ยาแก้ปวดลดไข้: paracetamol หรือ ibuprofen โดยเฉพาะใน 24 ชม.แรก', en:'Analgesia: paracetamol or ibuprofen, especially in the first 24h'} ] },
      { icon:'📅', h:{th:'การติดตามอาการ',en:'Follow-up'}, list:[
          {th:'นัดติดตามอาการภายใน 48–72 ชั่วโมง', en:'Reassess within 48–72 hours'} ] },
      { icon:'🏥', h:{th:'ข้อบ่งชี้ส่งปรึกษาแพทย์ ENT',en:'ENT referral criteria'}, list:[
          {th:'ปวดหูรุนแรงตั้งแต่เริ่มต้น', en:'Severe ear pain from onset'},
          {th:'ได้ยาต้านจุลชีพเหมาะสมแล้ว 48–72 ชม. แต่ยังมีไข้สูงและ/หรือปวดหูรุนแรง', en:'Still febrile and/or in severe pain after 48–72h of appropriate antibiotics'},
          {th:'มีน้ำคั่งในหูชั้นกลาง ≥3 เดือน ร่วมกับสูญเสียการได้ยิน', en:'Middle-ear effusion ≥3 months with hearing loss'},
          {th:'เป็น AOM ซ้ำ ≥3 ครั้งใน 6 เดือน หรือ ≥4 ครั้งใน 1 ปี', en:'Recurrent AOM ≥3 episodes/6 months or ≥4 episodes/year'} ] }
    ].filter(Boolean);

    return { severity: sev, title, summary, sections };
  }
};

RESP_MODULES.rhinosinusitis = {
  id:'rhinosinusitis',
  icon:'🤧',
  name:{th:'ไซนัสอักเสบเฉียบพลัน', en:'Acute Rhinosinusitis'},
  short:{th:'Acute Bacterial Rhinosinusitis', en:'Persistent/severe/worsening cold symptoms'},
  questions:[

      hint:{th:'เช่น ตาบวมรอบดวงตา ตาโปน กลอกตาผิดปกติ ปวดศีรษะรุนแรง หรืออาการทางระบบประสาท', en:'e.g. periorbital swelling, proptosis, restricted eye movement, severe headache, or neurologic signs'},
      options:[ opt('yes',{th:'มี — สงสัยภาวะแทรกซ้อน',en:'Yes — complication suspected'}), opt('no',{th:'ไม่มี',en:'No'}) ] },

      hint:{th:'เลือกอย่างน้อย 1 ข้อเพื่อเข้าเกณฑ์วินิจฉัย', en:'Select at least one pattern to meet diagnostic criteria'},
      showIf: a => a.complication==='no',
      options:[

        opt('severe',{th:'ไข้สูง ≥39°C ร่วมกับน้ำมูกข้นเป็นหนอง เกิดพร้อมกันติดต่อกัน 3–4 วัน',en:'High fever ≥39°C with purulent nasal discharge together for 3–4 consecutive days'}),

        opt('none',{th:'ไม่มีลักษณะดังกล่าว',en:'None of the above'})
      ] },
    { key:'risk', type:'multiselect', text:{th:'ปัจจัยเสี่ยงต่อเชื้อดื้อยา', en:'Risk factors for resistant organisms'},
      showIf: a=>a.complication==='no',
      options:[ opt('recentabx',{th:'ได้ยาต้านจุลชีพภายใน 30–90 วันที่ผ่านมา หรือได้บ่อยๆ',en:'Antibiotics within the past 30–90 days, or frequent use'}),
                opt('u2',{th:'อายุน้อยกว่า 2 ปี',en:'Age under 2 years'}),
                opt('daycare',{th:'อยู่ในสถานรับเลี้ยงเด็กอ่อน',en:'Attends daycare'}),
                opt('smoke',{th:'สัมผัสควันบุหรี่',en:'Environmental tobacco smoke exposure'}),
                opt('none',{th:'ไม่มีปัจจัยเสี่ยงต่อเชื้อดื้อยา',en:'No risk factors'}) ] },
    { key:'allergy', type:'select', text:{th:'ประวัติแพ้ยากลุ่ม Penicillin', en:'Penicillin allergy history'},
      showIf: a=>a.complication==='no',
      options:[ opt('none',{th:'ไม่มีประวัติแพ้',en:'No known allergy'}),
                opt('mild',{th:'แพ้ไม่รุนแรง (non type-1)',en:'Non-severe (non type-1) reaction'}),
                opt('severe',{th:'แพ้รุนแรง (type-1 hypersensitivity)',en:'Severe (type-1) hypersensitivity'}) ] }
  ],
  compute(a){

      return { severity:'severe', title:{th:'สงสัยภาวะแทรกซ้อน — ส่งต่อด่วน',en:'Complication suspected — urgent referral'},
        summary:{th:'อาการเข้าได้กับภาวะแทรกซ้อนของไซนัสอักเสบ (periorbital/orbital cellulitis, intracranial extension) ควรส่ง CT/MRI พร้อมสารทึบรังสี และปรึกษาแพทย์เฉพาะทางโสต ศอ นาสิก/กุมารเวชศาสตร์โรคติดเชื้อโดยด่วน',
                 en:'Findings are consistent with sinusitis complications (periorbital/orbital cellulitis, intracranial extension). Obtain contrast CT/MRI and urgently refer to ENT / pediatric infectious disease.'},
        sections:[ { icon:'🚑', h:{th:'ดำเนินการทันที',en:'Immediate actions'}, list:[
            {th:'ส่งตรวจภาพรังสี CT scan (ฉีดสารทึบรังสี) หรือ MRI', en:'Contrast-enhanced CT or MRI'},
            {th:'ปรึกษา ENT และ/หรือกุมารแพทย์โรคติดเชื้อทันที', en:'Immediate ENT and/or pediatric ID consultation'},
            {th:'พิจารณาให้ยาต้านจุลชีพทางหลอดเลือดดำครอบคลุมเชื้อกว้าง ระหว่างรอผล', en:'Consider broad-spectrum IV antibiotics pending evaluation'} ] } ] };

        summary:{th:'อาการน่าจะเป็นโรคหวัดจากไวรัสธรรมดา (viral URI) ซึ่งจะดีขึ้นเองได้ ยังไม่มีข้อบ่งชี้ให้ยาต้านจุลชีพ แนะนำรักษาตามอาการและติดตามอาการ',
                 en:'Symptoms are more consistent with an ordinary viral cold, which is self-limited. Antibiotics are not yet indicated — treat supportively and monitor.'}, sections:[] };
    }
    const severeOnset = a.pattern.includes('severe');

    const highDose = severeOnset || hasRisk;
    let drugs = [];
    if(a.allergy==='none'){
      if(highDose){
        drugs.push({name:'Amoxicillin-clavulanate', dose:{th:'80–90 มก./กก./วัน (ของ amoxicillin) + clavulanate 6.4 มก./กก./วัน (สัดส่วน 14:1) แบ่ง 2 เวลา', en:'80–90 mg/kg/day amoxicillin + 6.4 mg/kg/day clavulanate (14:1 ratio), divided BID'}});
      } else {
        drugs.push({name:'Amoxicillin', dose:{th:'40–50 มก./กก./วัน แบ่ง 2 เวลา', en:'40–50 mg/kg/day divided BID'}});
      }
    } else if(a.allergy==='mild'){
      drugs.push({name:'Cefuroxime', dose:{th:'30 มก./กก./วัน แบ่ง 2 เวลา', en:'30 mg/kg/day divided BID'}});
      drugs.push({name:'Cefdinir', dose:{th:'14 มก./กก./วัน วันละ 1–2 ครั้ง', en:'14 mg/kg/day once or twice daily'}});

      drugs.push({name:'Clarithromycin', dose:{th:'15 มก./กก./วัน วันละ 2 ครั้ง นาน 10–14 วัน', en:'15 mg/kg/day BID for 10–14 days'}});
      drugs.push({name:'Azithromycin', dose:{th:'10–12 มก./กก./วัน วันละครั้ง นาน 5 วัน', en:'10–12 mg/kg/day once daily for 5 days'}});

      sections:[

    }

    // Antibiotic recommendation
    let drugs = [];
    if(!severe){
      if(a.age==='m1_3'){
        drugs.push({name:'Amoxicillin (high dose)', dose:{th:'80–90 มก./กก./วัน แบ่ง 2–3 เวลา', en:'80–90 mg/kg/day divided 2–3 doses'}});
        drugs.push({name:'Erythromycin หรือ Azithromycin', dose:{th:'พิจารณาแทน/ร่วมด้วย หากสงสัย atypical pneumonia หรือไม่มีไข้ (สงสัย C. trachomatis)', en:'Consider instead/in addition if atypical pneumonia suspected, or afebrile (suspect C. trachomatis)'}});
      } else {
        drugs.push({name:'Amoxicillin', dose:{th:'80–90 มก./กก./วัน แบ่ง 2–3 เวลา (สูงสุด 2,000–3,000 มก./วัน)', en:'80–90 mg/kg/day divided 2–3 doses (max 2,000–3,000 mg/day)'}});
        if(a.atypical==='yes'){

      sections.push({ icon:'⏱', h:{th:'ระยะเวลาและติดตาม',en:'Duration & follow-up'}, list:[
          {th:'Amoxicillin/cephalosporin: 7–10 วัน · Erythromycin: 14 วัน · Azithromycin: 5 วัน · Clarithromycin: 10–14 วัน', en:'Amoxicillin/cephalosporin: 7–10 days · Erythromycin: 14 days · Azithromycin: 5 days · Clarithromycin: 10–14 days'},
          {th:'นัดตรวจซ้ำเมื่อกินยาครบ 2 วัน หากไม่ดีขึ้นให้พิจารณาเปลี่ยนยาหรือรับไว้รักษาในโรงพยาบาล', en:'Recheck after 2 days of treatment; if not improving, change antibiotic or admit'},
          {th:'หากเปลี่ยนยา ให้ครอบคลุมเชื้อดื้อยา: amoxicillin-clavulanic acid, cefditoren, cefdinir', en:'If switching, cover resistant organisms: amoxicillin-clavulanic acid, cefditoren, cefdinir'} ] });
    } else {
      drugs.push({name:'Ampicillin', dose:{th:'150–200 มก./กก./วัน แบ่งให้ทุก 6 ชม. ทางหลอดเลือดดำ', en:'150–200 mg/kg/day IV, divided q6h'}});
      drugs.push({name:'หรือ Cefotaxime', dose:{th:'100–200 มก./กก./วัน แบ่งให้ทุก 6–8 ชม.', en:'100–200 mg/kg/day, divided q6–8h'}});
      drugs.push({name:'หรือ Ceftriaxone', dose:{th:'50–100 มก./กก./วัน แบ่งให้ทุก 12–24 ชม.', en:'50–100 mg/kg/day, divided q12–24h'}});
      if(a.atypical==='yes') drugs.push({name:'+ Erythromycin/Clarithromycin/Azithromycin (กิน)', dose:{th:'เพิ่มหากสงสัย atypical pathogen', en:'Add oral macrolide if atypical pathogen suspected'}});
      drugs.push({name:'Cloxacillin (แทนที่/เพิ่ม)', dose:{th:'150–200 มก./กก./วัน แบ่งทุก 6–8 ชม. หากสงสัยเชื้อ S. aureus', en:'150–200 mg/kg/day q6–8h if S. aureus suspected'}});
      drugs.push({name:'Vancomycin (พิจารณา)', dose:{th:'40–60 มก./กก./วัน แบ่งทุก 6–8 ชม. หากสงสัยเชื้อดื้อยารุนแรง', en:'40–60 mg/kg/day q6–8h if severe resistant organism suspected'}});
      sections.push({ icon:'🏥', h:{th:'รับไว้ในโรงพยาบาล — ยาต้านจุลชีพชนิดฉีด',en:'Admit — IV antibiotics'}, drugs });
      sections.push({ icon:'🫧', h:{th:'การรักษาสนับสนุน',en:'Supportive care'}, list:[
          {th:'ให้ออกซิเจนเพื่อรักษา SpO2 ≥92%', en:'Oxygen to maintain SpO2 ≥92%'},
          {th:'ให้สารน้ำอย่างเพียงพอ ระวังภาวะโซเดียมต่ำ (SIADH พบได้บ่อยในปอดบวมรุนแรง)', en:'Adequate fluids; monitor for hyponatremia (SIADH is common in severe pneumonia)'},
          {th:'พ่นยาขยายหลอดลมหากฟังได้ยิน wheeze/rhonchi และตอบสนองดี', en:'Bronchodilator nebulization if wheeze/rhonchi present and responsive'},
          {th:'ไม่แนะนำทำกายภาพบำบัดทรวงอกในระยะเฉียบพลัน', en:'Chest physiotherapy not recommended in the acute phase'} ] });
      sections.push({ icon:'⏱', h:{th:'ระยะเวลาและการเปลี่ยนเป็นยากิน',en:'Duration & switch to oral'}, list:[
          {th:'เปลี่ยนเป็นยากิน (cefditoren, cefdinir, amoxicillin-clavulanic acid) เมื่ออาการดีขึ้น รวมนาน 10–14 วัน', en:'Switch to oral (cefditoren, cefdinir, amoxicillin-clavulanic acid) once improving; total 10–14 days'},
          {th:'หากยืนยันเชื้อ S. aureus: ให้ cloxacillin IV แล้วเปลี่ยนเป็นกิน รวมนานอย่างน้อย 3 สัปดาห์', en:'If S. aureus confirmed: IV cloxacillin then oral, total ≥3 weeks'},
          {th:'อาการไม่ดีขึ้นหรือยังมีไข้หลัง 48 ชม. ให้ประเมินภาวะแทรกซ้อน (pleural effusion, empyema, lung abscess) ด้วยภาพรังสีทรวงอก', en:'If not improving or still febrile after 48h, evaluate for complications (effusion, empyema, abscess) with chest imaging'} ] });
    }

    if(a.flu==='yes'){
      sections.push({ icon:'🦠', h:{th:'สงสัยไข้หวัดใหญ่ — ยาต้านไวรัส',en:'Suspected influenza — antiviral'}, list:[
          {th:'Oseltamivir กินวันละ 2 ครั้ง นาน 5 วัน ขนาดยาตามน้ำหนัก/อายุ (เด็ก >1 ปี น้ำหนัก >40 กก.: 75 มก./ครั้ง, 23–40 กก.: 60 มก./ครั้ง, 15–23 กก.: 45 มก./ครั้ง, <15 กก.: 30 มก./ครั้ง; เด็ก <1 ปี: 3–3.5 มก./กก./ครั้ง)', en:'Oseltamivir BID for 5 days, dosed by weight/age (age >1y: >40kg 75mg/dose, 23–40kg 60mg/dose, 15–23kg 45mg/dose, <15kg 30mg/dose; age <1y: 3–3.5 mg/kg/dose)'} ] });
    }

    sections.push({ icon: severe?'🏥':'🏠', h:{th:'การรับไว้รักษาในโรงพยาบาล',en:'Hospitalization'}, list:[
        {th: severe ? 'เข้าเกณฑ์ปอดบวมรุนแรง — ควรรับไว้รักษาในโรงพยาบาล' : 'อาการไม่รุนแรง — อาจรักษาแบบผู้ป่วยนอกได้ หากติดตามอาการได้', en: severe ? 'Meets severe pneumonia criteria — admission recommended' : 'Non-severe — outpatient management possible if follow-up is reliable'},
        {th:'ข้อบ่งชี้เพิ่มเติม: มีโรคประจำตัว (หัวใจพิการแต่กำเนิด ภูมิคุ้มกันบกพร่อง โรคปอดเรื้อรัง), สงสัยเชื้อ S. aureus/GAS, ผู้ปกครองดูแลไม่ได้หรือบ้านไกล, รักษาแบบผู้ป่วยนอก 48 ชม.แล้วไม่ดีขึ้น', en:'Also admit if: comorbidity (congenital heart disease, immunodeficiency, chronic lung disease), suspected S. aureus/GAS, unreliable caregiving/follow-up, or not improving after 48h outpatient treatment'} ] });

    return { severity: severe?'severe':'mild',
      title:{th: severe? 'ปอดบวมรุนแรง' : 'ปอดบวมไม่รุนแรง', en: severe? 'Severe pneumonia' : 'Non-severe pneumonia'},
      summary:{th:`RR ${rr||'-'} /min, SpO2 ${a.spo2||'-'}% — ${rr>0 && rr < (isInfant?(a.age==='neo'?60:a.age==='m1_3'?50:50):(a.age==='y1_5'?40:30)) ? 'ไม่เข้าเกณฑ์หายใจเร็วตามอายุ ควรทบทวนการวินิจฉัย' : 'เข้าเกณฑ์หายใจเร็วตามอายุ'}`,
               en:`RR ${rr||'-'} /min, SpO2 ${a.spo2||'-'}%`},
      sections };
  }
};

/* ============================= RENDER ENGINE ============================= */
function rsActiveQuestions(mod, answers){
  return mod.questions.filter(q => !q.showIf || q.showIf(answers));
}

function rsRender(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(rsState.screen === 'home'){ rsRenderHome(app); return; }
  const mod = RESP_MODULES[rsState.moduleId];
  const qs = rsActiveQuestions(mod, rsState.answers);
  if(rsState.step >= qs.length){ rsRenderResult(app, mod); return; }
  rsRenderQuestion(app, mod, qs, rsState.step);
}

function rsRenderHome(app){
  const backBtn = document.createElement('button');
  backBtn.className='top-back-link';
  backBtn.textContent = t(UI.backToMainHome);
  backBtn.onclick = goMainHome;
  app.appendChild(backBtn);

  const hero = document.createElement('div');
  hero.innerHTML = `
    <div class="hero">
      <span class="eyebrow" data-i18n="respHomeEyebrow">${t(UI.respHomeEyebrow)}</span>
      <h1 data-i18n="respHomeTitle">${t(UI.respHomeTitle)}</h1>
      <p data-i18n="respHomeDesc">${t(UI.respHomeDesc)}</p>
    </div>
    <div class="scope-note" data-i18n="respScopeNote">${t(UI.respScopeNote)}</div>
  `;
  app.appendChild(hero);
  const grid = document.createElement('div');
  grid.className = 'module-grid';
  Object.values(RESP_MODULES).forEach(mod=>{
    const card = document.createElement('button');
    card.className='module-card';
    card.onclick = ()=>rsOpenModule(mod.id);
    card.innerHTML = `
      <div class="icon">${mod.icon}</div>
      <div class="txt">
        <div class="name">${t(mod.name)}</div>
        <div class="desc">${t(mod.short)}</div>
      </div>
      <div class="arrow">›</div>`;
    grid.appendChild(card);
  });
  app.appendChild(grid);
  const ref = document.createElement('div');
  ref.className='ref-note';
  ref.textContent = t(UI.respRefFooter);
  app.appendChild(ref);
}

function rsRenderQuestion(app, mod, qs, idx){
  const q = qs[idx];
  const total = qs.length;
  const wrap = document.createElement('div');

  const head = document.createElement('div');
  head.className='wizard-head';
  head.innerHTML = `<button class="back-btn" id="backBtn">‹</button><div class="wizard-title">${t(mod.name)}</div>`;
  wrap.appendChild(head);

  const track = document.createElement('div');
  track.className='progress-track';
  track.innerHTML = `<div class="progress-fill" style="width:${Math.round(((idx)/total)*100)}%"></div>`;
  wrap.appendChild(track);

  const card = document.createElement('div');
  card.className='q-card';
  let optionsHtml = '';
  const currentVal = rsState.answers[q.key];

  if(q.type==='select'){
    optionsHtml = `<div class="opt-list">` + q.options.map(o=>{
      const sel = currentVal===o.value ? 'selected':'';
      return `<button class="opt-btn radio ${sel}" data-val="${o.value}"><span class="chk">${sel?'✓':''}</span>${t(o.label)}</button>`;
    }).join('') + `</div>`;
  } else if(q.type==='multiselect'){
    optionsHtml = `<div class="opt-list">` + q.options.map(o=>{
      const arr = currentVal || [];
      const sel = arr.includes(o.value) ? 'selected':'';
      return `<button class="opt-btn ${sel}" data-val="${o.value}"><span class="chk">${sel?'✓':''}</span>${t(o.label)}</button>`;
    }).join('') + `</div>`;
  } else if(q.type==='number'){
    const minAttr = q.min!==undefined ? `min="${q.min}"` : '';
    const maxAttr = q.max!==undefined ? `max="${q.max}"` : '';
    optionsHtml = `<input class="num-input" id="numInput" type="number" inputmode="decimal" ${minAttr} ${maxAttr} value="${currentVal||''}" placeholder="${LANG==='th'?'ระบุตัวเลข':'Enter a number'}">
      ${(q.min!==undefined && q.max!==undefined) ? `<div class="field-unit" id="numRangeHint">${LANG==='th'?`กรอกค่าระหว่าง ${q.min}–${q.max}`:`Enter a value between ${q.min}–${q.max}`}</div>` : ''}
      <div class="field-unit" id="numErrorHint" style="color:var(--sev-tx); display:none;"></div>`;
  }

  card.innerHTML = `
    <div class="q-label">${t(UI.stepOf)} ${idx+1} / ${total}</div>
    <div class="q-text">${t(q.text)}</div>
    ${q.hint ? `<div class="q-hint">${t(q.hint)}</div>` : (q.type==='multiselect' ? `<div class="q-hint">${t(UI.selectMulti)}</div>` : '')}
    ${optionsHtml}
  `;
  wrap.appendChild(card);

  const nav = document.createElement('div');
  nav.className='wizard-nav';
  const isLast = idx === total-1;
  const hasNoneOpt = q.type==='multiselect' && q.options.some(o=>o.value==='none');
  const multiselectOk = q.type==='multiselect' ? (hasNoneOpt ? (currentVal && currentVal.length>0) : true) : false;
  const canProceed = q.optional || multiselectOk || (q.type!=='multiselect' && currentVal!==undefined && currentVal!=='');
  nav.innerHTML = `<button class="btn btn-primary" id="nextBtn" ${canProceed?'':'disabled'}>${isLast? t(UI.seeResult) : t(UI.next)}</button>`;
  wrap.appendChild(nav);

  app.appendChild(wrap);

  document.getElementById('backBtn').onclick = ()=>{
    if(rsState.step===0) rsGoHome(); else { scrollToTop(); rsState.step--; rsRender(); }
  };
  if(q.type==='select'){
    card.querySelectorAll('.opt-btn').forEach(btn=>{
      btn.onclick = ()=>{ rsState.answers[q.key]=btn.getAttribute('data-val'); rsRender(); };
    });
  } else if(q.type==='multiselect'){
    card.querySelectorAll('.opt-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const val = btn.getAttribute('data-val');
        let arr = rsState.answers[q.key] || [];
        if(val==='none'){
          arr = arr.includes('none') ? [] : ['none'];
        } else {
          arr = arr.filter(v=>v!=='none');
          if(arr.includes(val)) arr = arr.filter(v=>v!==val); else arr = arr.concat([val]);
        }
        rsState.answers[q.key]=arr; rsRender();
      };
    });
  } else if(q.type==='number'){
    const inp = document.getElementById('numInput');
    const errHint = document.getElementById('numErrorHint');
    const validate = ()=>{
      const v = inp.value;
      let valid = (q.optional || v!=='');
      let outOfRange = false;
      if(v!==''){
        const num = parseFloat(v);
        if(q.min!==undefined && num < q.min) outOfRange = true;
        if(q.max!==undefined && num > q.max) outOfRange = true;
      }
      if(outOfRange){
        valid = false;
        errHint.style.display = 'block';
        errHint.textContent = LANG==='th' ? `ค่าต้องอยู่ระหว่าง ${q.min}–${q.max}` : `Value must be between ${q.min}–${q.max}`;
      } else if(errHint){
        errHint.style.display = 'none';
      }
      document.getElementById('nextBtn').disabled = !valid;
    };
    inp.oninput = ()=>{ rsState.answers[q.key]=inp.value; validate(); };
    validate();
  }
  document.getElementById('nextBtn').onclick = ()=>{ scrollToTop(); rsState.step++; rsRender(); };
}

function rsRenderResult(app, mod){
  const result = mod.compute(rsState.answers);
  const wrap = document.createElement('div');

  const head = document.createElement('div');
  head.className='wizard-head';
  head.innerHTML = `<button class="back-btn" id="backBtn">‹</button><div class="wizard-title">${t(mod.name)}</div>`;
  wrap.appendChild(head);

  const banner = document.createElement('div');
  banner.className = `result-banner ${result.severity}`;
  const tagMap = {mild:{th:'ระดับความรุนแรงน้อย / คำแนะนำเบื้องต้น',en:'Lower acuity / initial guidance'}, moderate:{th:'ระดับปานกลาง',en:'Moderate acuity'}, severe:{th:'ต้องดูแลใกล้ชิด / รุนแรง',en:'Close monitoring / severe'}, info:{th:'ข้อมูลเพิ่มเติม',en:'Additional information'}};
  banner.innerHTML = `<div class="tag">${t(tagMap[result.severity])}</div><h2>${t(result.title)}</h2><p>${t(result.summary)}</p>`;
  wrap.appendChild(banner);

  (result.sections||[]).forEach(sec=>{
    const sc = document.createElement('div');
    sc.className='section-card';
    let inner = `<h3>${sec.icon||''} ${t(sec.h)}</h3>`;
    if(sec.drugs && sec.drugs.length){
      inner += sec.drugs.map(d=>`<div class="drugline"><span class="dname">${d.name}</span><span class="ddose">${t(d.dose)}</span></div>`).join('');
    }
    if(sec.extra && sec.extra.length){
      inner += `<ul>${sec.extra.map(e=>`<li>${t(e)}</li>`).join('')}</ul>`;
    }
    if(sec.list && sec.list.length){
      inner += `<ul>${sec.list.map(e=>`<li>${t(e)}</li>`).join('')}</ul>`;
    }
    sc.innerHTML = inner;
    wrap.appendChild(sc);
  });

  const restart = document.createElement('button');
  restart.className='restart-btn';
  restart.textContent = t(UI.restart);
  restart.onclick = ()=> rsOpenModule(mod.id);
  wrap.appendChild(restart);

  const home = document.createElement('button');
  home.className='restart-btn';
  home.style.marginTop='8px';
  home.style.border='none';
  home.style.color='var(--ink-soft)';
  home.textContent = t(UI.home);
  home.onclick = rsGoHome;
  wrap.appendChild(home);

  const ref = document.createElement('div');
  ref.className='ref-note';
  ref.textContent = t(UI.respRefFooter);
  wrap.appendChild(ref);

  app.appendChild(wrap);
  document.getElementById('backBtn').onclick = ()=>{ scrollToTop(); rsState.step = rsActiveQuestions(mod,rsState.answers).length - 1; rsRender(); };
}

  return vals.reduce((a,b)=>a+b,0);
}
function fvYaleInterpret(total){
  if(total<10) return FV.yale.interp[0];
  if(total<=16) return FV.yale.interp[1];
  return FV.yale.interp[2];
}
function fvCanFinishChild336(){
  const total = fvYaleTotal();
  if(total===null) return false;
  if(total>=10) return true;
  return fvState.temp39!==null;
}

function fvRenderResultBlock(app, r){
  const banner = document.createElement('div');
  banner.className = `result-banner ${r.sev}`;

    let inner = `<h3>${sec.icon||''} ${t(sec.h)}</h3>`;

      inner += sec.drugs.map(d=>`<div class="drugline"><span class="dname">${d.name}</span><span class="ddose">${t(d.dose)}</span></div>`).join('');

    app.appendChild(sc);
  });

  fvHeader(app, t(FV.refBadge));
  const wrap = document.createElement('div');
  if(fvState.ageGroup==='neonate'){
    fvRenderResultBlock(wrap, FV.result.neonate);
  } else if(fvState.ageGroup==='infant13'){
    const isLowRisk = Object.values(fvState.roch).every(v=>v===true);
    fvRenderResultBlock(wrap, isLowRisk ? FV.result.infantLow : FV.result.infantHigh);
  } else if(fvState.ageGroup==='child336'){
    const total = fvYaleTotal();
    if(total>=10) fvRenderResultBlock(wrap, FV.result.childToxic);

  }

  restart.className='restart-btn';
  restart.textContent = t(UI.restart);
  restart.onclick = ()=>{ fvResetAll(); scrollToTop(); render(); };
  wrap.appendChild(restart);
  const ref = document.createElement('div');
  ref.className='ref-note';
  ref.textContent = t(FV.refFooter);
  wrap.appendChild(ref);
  app.appendChild(wrap);
}

function syComputeScenario(f){
  const mVal = syTiterValue(f.maternalTiter);
  const iVal = syTiterValue(f.infantTiter);
  const examAbnormal = Object.values(f.exam).some(Boolean);
  const darkfieldPositive = f.darkfield === true;
  let fold=null, titerFlag=null;
  if(mVal===0 && iVal>0){ titerFlag='mother-nonreactive'; fold=Infinity; }
  else if(mVal===0 && iVal===0){ fold=0; }
  else { fold = iVal/mVal; }
  const titerFourfold = fold>=4;
  if(examAbnormal || (titerFourfold && titerFlag!=='mother-nonreactive') || darkfieldPositive){
    return { scenario:1, fold, examAbnormal, darkfieldPositive, titerFlag };
  }
  const mt = f.maternalTreatment;
  if(mt==='A'||mt==='B'||mt==='C') return { scenario:2, fold, examAbnormal, darkfieldPositive, titerFlag };
  if(mt==='D'){
    if(f.reinfection===true) return { scenario:2, fold, examAbnormal, darkfieldPositive, titerFlag };
    return { scenario:3, fold, examAbnormal, darkfieldPositive, titerFlag };
  }
  if(mt==='E'){
    if(f.reinfection===true) return { scenario:2, fold, examAbnormal, darkfieldPositive, titerFlag };
    if(f.serofast===true) return { scenario:4, fold, examAbnormal, darkfieldPositive, titerFlag };
    return { scenario:2, fold, examAbnormal, darkfieldPositive, titerFlag };
  }
  return { scenario:null, fold, examAbnormal, darkfieldPositive, titerFlag };
}

const syInitialForm = { maternalTiter:'1:8', infantTiter:'1:8', darkfield:null, exam:{}, maternalTreatment:null, reinfection:null, serofast:null };
let syState = { step:0, form: JSON.parse(JSON.stringify(syInitialForm)) };

function syResetAll(){ syState = { step:0, form: JSON.parse(JSON.stringify(syInitialForm)) }; }

function syCanProceedFromMaternal(){
  const f = syState.form;
  return f.maternalTreatment !== null &&
    !(f.maternalTreatment==='D' && f.reinfection===null) &&
    !(f.maternalTreatment==='E' && (f.reinfection===null || (f.reinfection===false && f.serofast===null)));
}
function syCanProceedFromLabs(){ return syState.form.darkfield !== null; }

function syRender(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const backBtn = document.createElement('button');
  backBtn.className='top-back-link';
  backBtn.textContent = t(UI.backToMainHome);
  backBtn.onclick = goMainHome;
  app.appendChild(backBtn);

  const head = document.createElement('div');
  head.className='wizard-head';
  const stepNames = [t(SY.stepMaternal), t(SY.stepExam), t(SY.stepLabs), t(SY.stepResult)];
  head.innerHTML = `<div class="wizard-title">${stepNames[syState.step]}</div>`;
  app.appendChild(head);

  const track = document.createElement('div');
  track.className='progress-track';
  track.innerHTML = `<div class="progress-fill" style="width:${Math.round((syState.step/3)*100)}%"></div>`;
  app.appendChild(track);

  if(syState.step===0) syMaternalView(app);
  else if(syState.step===1) syExamView(app);
  else if(syState.step===2) syLabsView(app);
  else if(syState.step===3) syResultView(app);
}

function syNav(app, opts){
  const nav = document.createElement('div');
  nav.className='wizard-nav';
  nav.innerHTML = `
    <button class="btn btn-ghost" id="syBack" ${opts.backDisabled?'disabled':''}>${t(UI.back)}</button>
    <button class="btn btn-primary" id="syNext" ${opts.nextDisabled?'disabled':''}>${opts.nextLabel || t(UI.next)}</button>
  `;
  app.appendChild(nav);
  document.getElementById('syBack').onclick = ()=>{ if(syState.step>0){ scrollToTop(); syState.step--; render(); } };
  document.getElementById('syNext').onclick = ()=>{ scrollToTop(); (opts.onNext || (()=>{ syState.step++; render(); }))(); };
}

function syMaternalView(app){
  const card = document.createElement('div');
  card.className='q-card';
  const f = syState.form;
  let html = `
    <div class="q-text">${t(SY.maternalHeader)}</div>
    <div class="opt-list">
      ${SY_MATERNAL_OPTIONS.map(o=>{
        const sel = f.maternalTreatment===o.id ? 'selected':'';
        return `<button class="opt-btn radio ${sel}" data-mt="${o.id}"><span class="chk">${sel?'✓':''}</span>${t(o)}</button>`;
      }).join('')}
    </div>
  `;
  if(f.maternalTreatment==='D' || f.maternalTreatment==='E'){
    html += `<div class="section-card" style="margin-top:14px;">
      <h3>${t(SY.reinfectionQ)}</h3>
      <div class="mini-note"><strong style="display:block;margin-bottom:4px;">${t(SY.reinfectionCriteriaLabel)}</strong>
        <ul>${SY_REINFECTION_CRITERIA.map(c=>`<li>${t(c)}</li>`).join('')}</ul>
      </div>
      <div class="toggle-row">
        <button class="opt-btn ${f.reinfection===true?'selected':''}" data-reinf="true">${t(SY.yes)}</button>
        <button class="opt-btn ${f.reinfection===false?'selected':''}" data-reinf="false">${t(SY.no)}</button>
      </div>
    </div>`;
  }
  if(f.maternalTreatment==='E' && f.reinfection===false){
    html += `<div class="section-card">
      <h3>${t(SY.serofastQ)}</h3>
      <div class="toggle-row">
        <button class="opt-btn ${f.serofast===true?'selected':''}" data-sero="true">${t(SY.yesShort)}</button>
        <button class="opt-btn ${f.serofast===false?'selected':''}" data-sero="false">${t(SY.noShort)}</button>
      </div>
    </div>`;
  }
  card.innerHTML = html;
  app.appendChild(card);

  card.querySelectorAll('[data-mt]').forEach(btn=>{
    btn.onclick = ()=>{ f.maternalTreatment = btn.getAttribute('data-mt'); f.reinfection=null; f.serofast=null; render(); };
  });
  card.querySelectorAll('[data-reinf]').forEach(btn=>{
    btn.onclick = ()=>{ f.reinfection = btn.getAttribute('data-reinf')==='true'; if(f.reinfection) f.serofast=null; render(); };
  });
  card.querySelectorAll('[data-sero]').forEach(btn=>{
    btn.onclick = ()=>{ f.serofast = btn.getAttribute('data-sero')==='true'; render(); };
  });

  syNav(app, { backDisabled:true, nextDisabled: !syCanProceedFromMaternal(), onNext: ()=>{ syState.step=1; render(); } });
}

function syResultView(app){
  const f = syState.form;
  const result = syComputeScenario(f);
  const meta = result.scenario ? SY_SCENARIO_META[result.scenario] : null;
  const wrap = document.createElement('div');
  if(meta){
    const banner = document.createElement('div');
    banner.className = `result-banner ${meta.sev}`;
    banner.innerHTML = `<h2>${t(meta.title)}</h2>`;
    wrap.appendChild(banner);

    if(result.titerFlag==='mother-nonreactive'){
      const note = document.createElement('div');
      note.className='mini-note';
      note.textContent = t(SY.motherNonreactiveNote);
      wrap.appendChild(note);
    }

    const evalCard = document.createElement('div');
    evalCard.className='section-card';
    evalCard.innerHTML = `<h3>🔬 ${t(SY.evaluationHeader)}</h3><ul>${meta.evaluation.map(e=>`<li>${t(e)}</li>`).join('')}</ul>`;
    wrap.appendChild(evalCard);

    const txCard = document.createElement('div');
    txCard.className='section-card';
    txCard.innerHTML = `<h3>💊 ${t(SY.treatmentHeader)}</h3><ul>${meta.treatment.map(e=>`<li>${t(e)}</li>`).join('')}</ul>`;
    wrap.appendChild(txCard);

    const noteCard = document.createElement('div');
    noteCard.className='section-card';
    noteCard.innerHTML = `<h3>📋 Note</h3><p style="font-size:12.5px; font-style:italic; color:var(--ink-soft); margin:0;">${t(meta.note)}</p>`;
    wrap.appendChild(noteCard);

    const foldStr = Number.isFinite(result.fold) ? ` (${result.fold}×)` : '';
    const summary = document.createElement('div');
    summary.className='ref-note';
    summary.innerHTML = `${t(SY.summaryPrefix)} maternal titer ${f.maternalTiter}, infant titer ${f.infantTiter}${foldStr} · ${t(SY.examLabel)} ${result.examAbnormal?t(SY.abnormalWord):t(SY.normalWord)} · ${t(SY.darkfieldLabel)} ${f.darkfield?t(SY.posWord):t(SY.negWord)}`;
    wrap.appendChild(summary);

    const consultNote = document.createElement('div');
    consultNote.className='mini-note';
    consultNote.style.background='var(--mod-bg)'; consultNote.style.borderColor='var(--mod-bd)'; consultNote.style.color='var(--mod-tx)';
    consultNote.textContent = t(SY.consultNote);
    wrap.appendChild(consultNote);
  }

  const restart = document.createElement('button');
  restart.className='restart-btn';
  restart.textContent = t(UI.restart);
  restart.onclick = ()=>{ syResetAll(); scrollToTop(); render(); };
  wrap.appendChild(restart);

  const backLink = document.createElement('button');
  backLink.className='restart-btn';
  backLink.style.marginTop='8px'; backLink.style.border='none'; backLink.style.color='var(--ink-soft)';
  backLink.textContent = t(UI.back);
  backLink.onclick = ()=>{ scrollToTop(); syState.step=2; render(); };
  wrap.appendChild(backLink);

  const ref = document.createElement('div');
  ref.className='ref-note';
  ref.textContent = t(SY.refFooter);
  wrap.appendChild(ref);

  app.appendChild(wrap);
}

function eoInitialForm(){
  return {
    gaBand:null,
    qASel:[], qB:null, qC:null, qDSel:[],
    appearance:null, riskFactor:null, feverType:null, iapAdequate:null
  };
}
let eoState = { screen:'ga', form: eoInitialForm() };
function eoResetAll(){ eoState = { screen:'ga', form: eoInitialForm() }; }
function eoGoTo(screen){ eoState.screen = screen; scrollToTop(); render(); }

function eoGaInfo(){
  const f = eoState.form;
  if(f.gaBand===null) return null;
  return { pathway: f.gaBand };
}

function eoRender(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const backBtn = document.createElement('button');
  backBtn.className='top-back-link';
  backBtn.textContent = t(UI.backToMainHome);
  backBtn.onclick = goMainHome;
  app.appendChild(backBtn);

  if(eoState.screen==='ga') eoGaView(app);
  else if(eoState.screen==='qA') eoQAView(app);
  else if(eoState.screen==='qB') eoQBView(app);
  else if(eoState.screen==='qC') eoQCView(app);
  else if(eoState.screen==='qD') eoQDView(app);
  else if(eoState.screen==='appearance') eoAppearanceView(app);
  else if(eoState.screen==='riskFactor') eoRiskFactorView(app);
  else if(eoState.screen==='feverType') eoFeverTypeView(app);
  else if(eoState.screen==='iapAdequate') eoIapAdequateView(app);
  else if(eoState.screen==='result') eoResultView(app);
}

function eoHeader(app, title){
  const head = document.createElement('div');
  head.className='wizard-head';
  head.innerHTML = `<div class="wizard-title">${title}</div>`;
  app.appendChild(head);
}

function eoNav(app, opts){
  const nav = document.createElement('div');
  nav.className='wizard-nav';
  nav.innerHTML = `
    <button class="btn btn-ghost" id="eoBack" ${opts.backDisabled?'disabled':''}>${t(UI.back)}</button>
    <button class="btn btn-primary" id="eoNext" ${opts.nextDisabled?'disabled':''}>${opts.nextLabel || t(UI.next)}</button>
  `;
  app.appendChild(nav);
  document.getElementById('eoBack').onclick = ()=>{ scrollToTop(); (opts.onBack || (()=>{}))(); };
  document.getElementById('eoNext').onclick = ()=>{ scrollToTop(); (opts.onNext || (()=>{}))(); };
  if(opts.backDisabled) document.getElementById('eoBack').onclick = ()=>{};
}

/* ---------- Step: GA ---------- */
function eoGaView(app){
  eoHeader(app, t(EO.refBadge));
  const card = document.createElement('div');
  card.className='q-card';
  const f = eoState.form;
  card.innerHTML = `
    <div class="q-text">${t(EO.gaHeading)}</div>
    <div class="q-hint">${t(EO.gaHint)}</div>
    <div class="opt-list">
      ${eoOptBtn({val:'preterm', label:EO.gaPretermLabel, desc:EO.gaPretermDesc}, f.gaBand==='preterm')}
      ${eoOptBtn({val:'term', label:EO.gaTermLabel, desc:EO.gaTermDesc}, f.gaBand==='term')}
    </div>
  `;
  app.appendChild(card);
  card.querySelectorAll('[data-val]').forEach(btn=>{
    btn.onclick = ()=>{ f.gaBand = btn.getAttribute('data-val'); render(); };
  });

  eoNav(app, {
    backDisabled:true,
    nextDisabled: !eoGaInfo(),
    onNext: ()=>{ const info = eoGaInfo(); eoGoTo(info.pathway==='preterm' ? 'qA' : 'appearance'); }
  });
}

/* ---------- Shared: render an option button, with optional bullet list ---------- */
function eoOptBtn(o, selected){
  const sel = selected ? 'selected' : '';
  const hasExtra = (o.bullets && o.bullets.length) || o.desc;
  if(!hasExtra){
    return `<button class="opt-btn radio ${sel}" data-val="${o.val}"><span class="chk">${sel?'✓':''}</span>${t(o.label)}</button>`;
  }
  let extraHtml = '';
  if(o.bullets && o.bullets.length){
    extraHtml = `<ul style="margin:6px 0 0 18px; padding:0; font-size:11.5px; color:var(--ink-soft); line-height:1.6;">${o.bullets.map(b=>`<li>${t(b)}</li>`).join('')}</ul>`;
  } else if(o.desc){
    extraHtml = `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:2px;">${t(o.desc)}</div>`;
  }
  return `<button class="opt-btn radio ${sel}" data-val="${o.val}" style="align-items:flex-start;"><span class="chk">${sel?'✓':''}</span><span style="flex:1;"><div style="font-weight:600;">${t(o.label)}</div>${extraHtml}</span></button>`;
}

/* ---------- Preterm (GA ≤34 6/7 wk) pathway — 4-step sequence ---------- */
/* Multiselect checklist (with mutually-exclusive "none" option), mirroring the
   respiratory module's multiselect pattern. Selecting any item clears "none";
   selecting "none" clears all items. Returns the derived answer: null (nothing
   picked yet), false ("none" picked), or true (≥1 item picked). */
function eoMultiValue(sel){
  if(!sel || sel.length===0) return null;
  return sel.includes('none') ? false : true;
}
function eoSelectedLabels(sel, bullets, lang){
  return bullets.filter(b=>sel.includes(b.val)).map(b=>b[lang]);
}

function eoMultiCard(app, heading, hint, bullets, noneLabel, sel, onChange){
  eoHeader(app, t(EO.refBadge));
  const card = document.createElement('div');
  card.className='q-card';
  card.innerHTML = `
    <div class="q-text">${t(heading)}</div>
    <div class="q-hint">${hint ? t(hint)+' · ' : ''}${t(UI.selectMulti)}</div>
    <div class="opt-list">
      ${bullets.map(b=>{
        const isSel = sel.includes(b.val);
        return `<button class="opt-btn ${isSel?'selected':''}" data-val="${b.val}"><span class="chk">${isSel?'✓':''}</span>${t(b)}</button>`;
      }).join('')}
      <div style="text-align:center; font-size:11px; color:var(--ink-soft); margin:2px 0;">${LANG==='th'?'หรือ':'or'}</div>
      <button class="opt-btn radio ${sel.includes('none')?'selected':''}" data-val="none"><span class="chk">${sel.includes('none')?'✓':''}</span>${t(noneLabel)}</button>
    </div>
  `;
  app.appendChild(card);
  card.querySelectorAll('[data-val]').forEach(btn=>{
    btn.onclick = ()=>{
      const val = btn.getAttribute('data-val');
      let arr = sel.slice();
      if(val==='none'){
        arr = arr.includes('none') ? [] : ['none'];
      } else {
        arr = arr.filter(v=>v!=='none');
        arr = arr.includes(val) ? arr.filter(v=>v!==val) : arr.concat([val]);
      }
      onChange(arr);
      render();
    };
  });
}

function eoYesNoCard(app, heading, hint, value, onPick){
  eoHeader(app, t(EO.refBadge));
  const card = document.createElement('div');
  card.className='q-card';
  card.innerHTML = `
    <div class="q-text">${t(heading)}</div>
    ${hint ? `<div class="q-hint">${t(hint)}</div>` : ''}
    <div class="toggle-row" style="margin-top:10px;">
      <button class="opt-btn ${value===true?'selected':''}" data-val="true">${t(EO.yes)}</button>
      <button class="opt-btn ${value===false?'selected':''}" data-val="false">${t(EO.no)}</button>
    </div>
  `;
  app.appendChild(card);
  card.querySelectorAll('[data-val]').forEach(btn=>{
    btn.onclick = ()=>{ onPick(btn.getAttribute('data-val')==='true'); render(); };
  });
  return card;
}

function eoQAView(app){
  const f = eoState.form;
  eoMultiCard(app, EO.qAHeading, EO.qAHint, EO.qABullets, EO.qANoneLabel, f.qASel, (arr)=>{

}

function eoQDView(app){

function eoGentaTableHtml(){

/* ---------- Result compute ---------- */
function eoCompute(){
  const f = eoState.form;
  const info = eoGaInfo();
  const gaLabel = f.gaBand==='preterm' ? t(EO.gaPretermLabel) : t(EO.gaTermLabel);

  const admitBlock = { icon:'🏥', h:{th:'การรับไว้ในโรงพยาบาลและการส่งตรวจ', en:'Admission & workup'}, list:[
    {th:'Admit Sick Newborn Unit', en:'Admit sick newborn unit'},
    {th:'ส่งตรวจ CBC และ Blood culture ก่อนเริ่มยาปฏิชีวนะ', en:'Send CBC and blood culture before starting antibiotics'}
  ]};
  const abxBlock = { icon:'💊', h:{th:'ยาปฏิชีวนะแบบครอบคลุม (Empiric antibiotics)', en:'Empiric antibiotics'}, prominent:true, drugs:[
    { name: t(EO.ampDrugName), dose: EO.ampDrugDose }
  ], extra:[
    {th:'ดูตารางขนาดยาโดยละเอียดด้านล่าง ปรับเปลี่ยนยาตามผลเพาะเชื้อและความไวต่อยาเมื่อทราบผล ปรึกษากุมารแพทย์/แพทย์โรคติดเชื้อเมื่อจำเป็น', en:'See the detailed dosing table below. Adjust therapy per culture and susceptibility results once available; consult a pediatrician/infectious disease specialist as needed'}
  ]};
  const durationBlock = { icon:'⏱️', h:{th:'ระยะเวลาการรักษา', en:'Duration of therapy'}, collapsible:true, openByDefault:false, extra:[
    {th:'โดยทั่วไปให้ยาจนทราบผล blood culture (36–48 ชั่วโมง) หากผลปลอดเชื้อ (sterile) และทารกอาการดีขึ้น พิจารณาหยุดยาได้ หากพบเชื้อในกระแสเลือดหรือน้ำไขสันหลัง ให้ปรับระยะเวลาการรักษาตามชนิดเชื้อและตำแหน่งของการติดเชื้อ', en:'Generally continue until blood culture results are final (36–48 h); if sterile and the infant is improving, antibiotics may be discontinued. If bacteremia or meningitis is confirmed, extend the duration according to the organism and site of infection'}
  ]};

  if(info.pathway==='preterm'){
    const qaVal = eoMultiValue(f.qASel);
    const qdVal = eoMultiValue(f.qDSel);
    const high = (qaVal===true || qdVal===true);
    if(high){
      const lpBlock = { icon:'🔬', h:{th:'การพิจารณาเจาะน้ำไขสันหลัง (LP)', en:'Consideration of lumbar puncture (LP)'}, list:[
        {th:'พิจารณาเจาะน้ำไขสันหลังส่งตรวจ CSF ในรายที่อาการทางคลินิกเข้าได้ชัดเจน หรือสงสัยเชื้อ GBS ชนิดรุกรานสูง เว้นแต่หัตถการจะทำให้อาการของทารกแย่ลง', en:'Consider LP for CSF analysis in clinically ill infants or when there is high suspicion for invasive GBS disease, unless the procedure would compromise the infant\u2019s condition'}
      ]};
      const triggerTh = qaVal===true
        ? `ทารกคลอดจาก ${eoSelectedLabels(f.qASel, EO.qABullets, 'th').join(', ')}`
        : `มีข้อบ่งชี้ความเสี่ยงเพิ่มเติม: ${eoSelectedLabels(f.qDSel, EO.qDBullets, 'th').join(', ')}`;
      const triggerEn = qaVal===true
        ? `the infant was born because of ${eoSelectedLabels(f.qASel, EO.qABullets, 'en').join(', ')}`
        : `an additional risk factor is present: ${eoSelectedLabels(f.qDSel, EO.qDBullets, 'en').join(', ')}`;
      return {
        severity:'severe',
        title:{th:'ความเสี่ยงสูงต่อ Early Onset Sepsis — Admit และเริ่มการรักษา', en:'High risk of early-onset sepsis — admit and treat'},
        summary:{th:`${gaLabel} · ${triggerTh} — เข้าเกณฑ์กลุ่มความเสี่ยงสูงตามแนวทาง AAP 2018`,
                 en:`${gaLabel} · ${triggerEn} — meets the AAP 2018 high-risk group`},
        sections:[admitBlock, abxBlock, eoDoseTableBlock(), lpBlock, durationBlock]
      };
    }
    const lowTriggerTh = f.qC===true
      ? 'ทารกคลอดโดยการผ่าตัดคลอดจากข้อบ่งชี้ทางมารดา/ทารก โดยไม่มีการแตกของถุงน้ำคร่ำมาก่อนเวลาคลอด'
      : 'ไม่มีข้อบ่งชี้ความเสี่ยงเพิ่มเติมตามเกณฑ์ประเมิน';
    const lowTriggerEn = f.qC===true
      ? 'the infant was born by cesarean for a maternal/fetal indication, with membranes intact until the time of delivery'
      : 'no additional risk factor is present on assessment';
    return {
      severity:'mild',
      title:{th:'ความเสี่ยงต่ำต่อ Early Onset Sepsis', en:'Low risk of early-onset sepsis'},
      summary:{th:`${gaLabel} · ${lowTriggerTh} — เข้าเกณฑ์กลุ่มความเสี่ยงต่ำตามแนวทาง AAP 2018`,
               en:`${gaLabel} · ${lowTriggerEn} — meets the AAP 2018 low-risk group`},
      sections:[
        { icon:'👁️', h:{th:'แนวทางที่เป็นไปได้ (Approaches include)', en:'Approaches include'}, prominent:true, list:[
          {th:'ไม่ต้องตรวจ lab และไม่ต้องให้ยาปฏิชีวนะ — เฝ้าสังเกตอาการทางคลินิกอย่างใกล้ชิด', en:'No laboratory evaluation and no empirical antibiotic therapy — with close clinical monitoring'},
          {th:'หรือ ส่งตรวจ Blood culture พร้อมเฝ้าติดตามอาการทางคลินิก โดยยังไม่เริ่มยาปฏิชีวนะ', en:'OR blood culture with clinical monitoring, without starting antibiotics'}
        ]},
        { icon:'⚠️', h:{th:'ข้อควรพิจารณา', en:'Points to consider'}, list:[
          {th:'หากทารกไม่ดีขึ้นหลังการดูแลเบื้องต้น หรือมีภาวะไม่คงที่ของระบบไหลเวียน/หายใจที่รุนแรง การเริ่มยาปฏิชีวนะแบบครอบคลุมเป็นทางเลือกที่สมเหตุสมผล แต่ไม่ใช่ข้อบังคับ — ควรประเมินซ้ำเป็นระยะ', en:'If the infant does not improve after initial stabilization, or develops severe systemic instability, starting empiric antibiotics is a reasonable — though not mandatory — option. Reassess periodically.'}
        ]}
      ]
    };
  }

  // term pathway (GA >= 35 weeks)
  if(f.appearance==='clinical'){
    return {
      severity:'severe',
      title:{th:'Clinical illness — Admit และเริ่มการรักษา', en:'Clinical illness — admit and treat'},
      summary:{th:`${gaLabel} · ทารกมีอาการเข้าได้กับ clinical illness`, en:`${gaLabel} · the infant meets clinical illness criteria`},
      sections:[admitBlock, abxBlock, eoDoseTableBlock(), durationBlock]
    };
  }
  if(f.appearance==='equivocal'){
    return {
      severity:'moderate',
      title:{th:'Equivocal illness — Admit และประเมินด้วย EOS Calculator', en:'Equivocal illness — admit and assess with the EOS Calculator'},
      summary:{th:`${gaLabel} · ทารกมีอาการเข้าได้กับ equivocal illness`, en:`${gaLabel} · the infant meets equivocal illness criteria`},
      sections:[
        admitBlock,
        { icon:'🧮', h:{th:'EOS Calculator Scoring', en:'EOS Calculator scoring'}, prominent:true, customHtml:
          `<p style="font-size:13.5px; line-height:1.7; margin:0 0 10px;">${t(EO.calcHow)}</p>
           <a href="${EO_KAISER_URL}" target="_blank" rel="noopener" style="display:inline-block; font-size:13px; font-weight:600; color:var(--pink-600); text-decoration:underline;">${t(EO.calcLinkLabel)} ↗</a>`
        },
        { icon:'📋', h:{th:'ผลที่ระบบอาจแนะนำ', en:'Possible calculator-guided outcomes'}, list:[
          {th:'เฝ้าระวังอาการทางคลินิก โดยไม่ต้องตรวจ lab หรือให้ยาปฏิชีวนะ', en:'Clinical monitoring only — no laboratory testing or antibiotics'},
          {th:'ส่งตรวจ CBC และ Blood culture โดยยังไม่เริ่มยาปฏิชีวนะ', en:'Send CBC and blood culture, without starting antibiotics'},
          {th:'ส่งตรวจ CBC, Blood culture พร้อมเริ่มยาปฏิชีวนะแบบครอบคลุม', en:'Send CBC and blood culture, and start empiric antibiotics'}
        ]}
      ]
    };
  }
  // well-appearing
  if(f.riskFactor==='none'){
    return {
      severity:'info',
      title:{th:'Routine care — ดูแลทารกตามปกติ', en:'Routine care'},
      summary:{th:`${gaLabel} · ทารกดูดี (well-appearing) และไม่มีปัจจัยเสี่ยงต่อ EOS`, en:`${gaLabel} · the infant is well-appearing with no EOS risk factors`},
      sections:[
        { icon:'🛏️', h:{th:'การดูแล', en:'Care'}, list:[
          {th:'ดูแลทารกตามปกติที่ Nursery ไม่จำเป็นต้องตรวจเพิ่มเติมหรือเฝ้าระวังพิเศษตามแนวทางนี้', en:'Routine nursery care — no additional testing or special monitoring is required under this guideline'}
        ]}
      ]
    };
  }
  if(f.riskFactor==='fever' && f.feverType==='confirmed'){
    return {
      severity:'severe',
      title:{th:'Confirmed Triple I — Admit และเริ่มการรักษา', en:'Confirmed Triple I — admit and treat'},
      summary:{th:`${gaLabel} · ทารกดูดี แต่มารดามีลักษณะเข้าได้กับ Confirmed Triple I`, en:`${gaLabel} · well-appearing infant, but the mother meets Confirmed Triple I criteria`},
      sections:[admitBlock, abxBlock, eoDoseTableBlock(), durationBlock]
    };
  }
  const isRoutine = (f.riskFactor==='gbsIap' && f.iapAdequate===true);
  if(isRoutine){
    return {
      severity:'info',
      title:{th:'Routine care — ดูแลทารกตามปกติ', en:'Routine care'},
      summary:{th:`${gaLabel} · ทารกดูดี และได้รับ GBS IAP อย่างเพียงพอ`, en:`${gaLabel} · well-appearing infant who received adequate GBS IAP`},
      sections:[
        { icon:'🛏️', h:{th:'การดูแล', en:'Care'}, list:[
          {th:'ดูแลทารกตามปกติที่ Nursery ไม่จำเป็นต้องตรวจเพิ่มเติมหรือเฝ้าระวังพิเศษตามแนวทางนี้', en:'Routine nursery care — no additional testing or special monitoring is required under this guideline'}
        ]}
      ]
    };
  }
  // serial assessment group: isolated fever / suspected Triple I / inadequate GBS IAP
  return {
    severity:'moderate',
    title:{th:'เฝ้าระวังอาการอย่างใกล้ชิด (Serial assessment) 48–72 ชั่วโมง', en:'Serial assessment for 48–72 hours'},
    summary:{th:`${gaLabel} · ทารกดูดี แต่มีปัจจัยเสี่ยงที่ยังไม่เข้าเกณฑ์ routine care — เฝ้าระวังที่ Nursery`, en:`${gaLabel} · well-appearing infant with a risk factor that does not meet routine-care criteria — monitor in the nursery`},
    sections:[
      { icon:'👁️', h:{th:'การเฝ้าระวัง (Serial assessment with VS)', en:'Serial assessment with vital signs'}, prominent:true, list:[
        {th:'เฝ้าระวังอาการทางคลินิกอย่างใกล้ชิด นาน 48–72 ชั่วโมง ที่ Nursery — ไม่ต้องตรวจ lab หรือให้ยาปฏิชีวนะในเบื้องต้น', en:'Close clinical monitoring for 48–72 hours in the nursery — no initial laboratory testing or antibiotics'},
        {th:'ประเมินอาการโดยพยาบาล อย่างน้อย 1 ครั้งต่อเวร', en:'Nursing assessment at least once per shift'},
        {th:'วัดสัญญาณชีพทุก 4 ชั่วโมง นาน 24 ชั่วโมงแรก จากนั้นทุก 4–8 ชั่วโมงจนจำหน่าย', en:'Vital signs every 4 hours for the first 24 hours, then every 4–8 hours until discharge'}
      ]},
      { icon:'⚠️', h:{th:'หากอาการแย่ลง', en:'If the infant deteriorates'}, list:[

function eoResultView(app){
  eoHeader(app, t(EO.refBadge));
  const wrap = document.createElement('div');
  const result = eoCompute();

  const banner = document.createElement('div');
  banner.className = `result-banner ${result.severity}`;
  banner.innerHTML = `<h2>${t(result.title)}</h2><p>${t(result.summary)}</p>`;
  wrap.appendChild(banner);

  (result.sections||[]).forEach(sec=>{
    const sc = document.createElement('div');
    sc.className = sec.prominent ? 'section-card prominent' : 'section-card';
    let body = sec.customHtml || '';
    if(sec.drugs && sec.drugs.length){ body += sec.drugs.map(d=>`<div class="drugline"><span class="dname">${d.name}</span><span class="ddose">${t(d.dose)}</span></div>`).join(''); }
    if(sec.extra && sec.extra.length){ body += `<ul>${sec.extra.map(e=>`<li>${t(e)}</li>`).join('')}</ul>`; }
    if(sec.list && sec.list.length){ body += `<ul>${sec.list.map(e=>`<li>${t(e)}</li>`).join('')}</ul>`; }
    if(sec.collapsible){
      sc.innerHTML = `<details ${sec.openByDefault?'open':''}>
        <summary style="cursor:pointer; font-size:13.5px; font-weight:600; color:var(--pink-600); list-style:none; display:flex; align-items:center; gap:7px;">${sec.icon||''} ${t(sec.h)} <span style="margin-left:auto; font-size:11px; color:var(--ink-soft); font-weight:400;">${LANG==='th'?'แตะเพื่อดูรายละเอียด':'tap for details'}</span></summary>
        <div style="margin-top:10px;">${body}</div>
      </details>`;
    } else {
      const headSize = sec.prominent ? '15px' : '13.5px';
      sc.innerHTML = `<h3 style="font-size:${headSize};">${sec.icon||''} ${t(sec.h)}</h3>${body}`;
    }
    wrap.appendChild(sc);
  });

  const restart = document.createElement('button');
  restart.className='restart-btn';
  restart.textContent = t(UI.restart);
  restart.onclick = ()=>{ eoResetAll(); scrollToTop(); render(); };
  wrap.appendChild(restart);

  const info = eoGaInfo();
  const ref = document.createElement('div');
  ref.className='ref-note';
  ref.textContent = t(info && info.pathway==='preterm' ? EO.refFooterPreterm : EO.refFooterTerm);
  wrap.appendChild(ref);

  app.appendChild(wrap);
}

function drAgeFlags(){
  const g = drState.age, sub = drState.ageSub;
  let under6mo=false, under3mo=false;
  if(g==='u2'){
    if(sub==='m1_3'){ under6mo=true; under3mo=true; }
    else if(sub==='m3_6'){ under6mo=true; under3mo=false; }
    else if(sub==='m6_24'){ under6mo=false; under3mo=false; }
  }
  return { under6mo, under3mo };
}

// CDC-scale rule: any single severe finding -> severe; any single mild-to-moderate finding -> moderate; else mild.
function drDehydrationSeverity(){
  const d = drState.dehydration;
  const items = DR.dehydration.items;
  if(items.some(it=> (d[it.key]||0)===2)) return 'severe';
  if(items.some(it=> (d[it.key]||0)===1)) return 'moderate';
  return 'mild';
}

function drCompute(){
  const { under6mo, under3mo } = drAgeFlags();
  const ageGroup = drState.age;
  const ageLabel = t(DR.ageGroupLabel[ageGroup]);

  const dehydration = drDehydrationSeverity(); // 'mild' | 'moderate' | 'severe'
  const shock = drState.danger.includes('shock');
  const hasDangerSign = drState.danger.filter(v=>v!=='none').length>0;
  const admitNeeded = shock || dehydration==='severe' || hasDangerSign;
  const vomitLimits = drState.danger.includes('vomit_severe');

  const ref = DR.deficitRef[ageGroup];
  const deficit = ref[dehydration]; // {pctLabel, mlkg} for the current tier
  const deficitNote = { th:`ปริมาณน้ำที่ขาดโดยประมาณสำหรับ${ageLabel} (${t(DR.tierTitle[dehydration])}): น้ำหนักตัวลดลง ${deficit.pctLabel} ≈ ${deficit.mlkg} มล./กก.`,
                         en:`Estimated fluid deficit for ${ageLabel} (${t(DR.tierTitle[dehydration])}): body weight loss ${deficit.pctLabel} ≈ ${deficit.mlkg} mL/kg` };

  const zincDose = under6mo ? {th:'10 มก./วัน นาน 10–14 วัน', en:'10 mg/day for 10–14 days'} : {th:'20 มก./วัน นาน 10–14 วัน', en:'20 mg/day for 10–14 days'};

  // needsIV: severe dehydration/shock always need IV; otherwise IV is needed if the patient is being
  // admitted for any reason, or can't tolerate oral fluids — regardless of the dehydration tier itself.
  const needsIV = shock || dehydration==='severe' || admitNeeded || vomitLimits;

  // ---------- Primary rehydration section (prominent) ----------
  let rehy;
  if(needsIV){
    let doseLines = [];
    let extraLines = [ deficitNote ];
    if(shock){
      doseLines.push({name:'0.9% NaCl (NSS) — bolus', dose:{th:'20 มล./กก. ทางหลอดเลือดดำ ภายใน 15 นาที ให้ซ้ำได้ 2–3 ครั้ง ขึ้นกับความรุนแรงและการตอบสนอง', en:'20 mL/kg IV over 15 minutes; may repeat 2–3 times depending on severity and response'}});
      extraLines.push({th:'หลังพ้นภาวะช็อก ให้สารน้ำต่อตามแนวทางขาดน้ำรุนแรง (bolus 20 มล./กก./ชม. ×2 ชม. หากยังไม่ได้ให้ แล้วตามด้วย subsequent fluid)', en:'Once shock resolves, continue per the severe-dehydration regimen (20 mL/kg/hr ×2h bolus if not already given, then subsequent fluid)'});
    } else if(dehydration==='severe'){
      doseLines.push({name:'0.9% NaCl (NSS) — bolus', dose:{th:'20 มล./กก./ชม. นาน 2 ชั่วโมง', en:'20 mL/kg/hr for 2 hours'}});
      extraLines.push({th:'Subsequent fluid (22 ชั่วโมงที่เหลือ) = maintenance + deficit − bolus ที่ให้ไปแล้ว เลือกชนิดสารน้ำตามอายุและระดับโซเดียมในเลือด (ดูหัวข้อด้านล่าง) หากเป็น hypernatremic dehydration (Na 145–160 mmol/L) ให้แก้ deficit ใน 48 ชั่วโมงแทน; หาก Na >160 mmol/L ควรปรึกษาผู้เชี่ยวชาญ', en:'Subsequent fluid (remaining 22h) = maintenance + deficit − bolus already given, fluid type chosen by age and serum sodium (see below). For hypernatremic dehydration (Na 145–160 mmol/L), correct the deficit over 48h instead; consult a specialist if Na >160 mmol/L'});
    } else if(dehydration==='moderate'){
      doseLines.push({name:'0.9% NaCl (NSS) — bolus', dose:{th:'20 มล./กก./ชม. นาน 1 ชั่วโมง (mild to moderate dehydration)', en:'20 mL/kg/hr for 1 hour (mild-to-moderate dehydration)'}});
      extraLines.push({th:'Subsequent fluid (22 ชั่วโมงที่เหลือ) = maintenance + deficit − bolus ที่ให้ไปแล้ว เลือกชนิดสารน้ำตามอายุและระดับโซเดียมในเลือด (ดูหัวข้อด้านล่าง)', en:'Subsequent fluid (remaining 22h) = maintenance + deficit − bolus already given, fluid type chosen by age and serum sodium (see below)'});
      extraLines.push({th:'สาเหตุที่ต้องให้ IV: ' + (vomitLimits ? 'อาเจียนรบกวนการดื่ม ORS' : 'เข้าเกณฑ์รับไว้ในโรงพยาบาลจากข้อบ่งชี้อื่น'), en:'Reason for IV: ' + (vomitLimits ? 'vomiting limits oral intake' : 'meets admission criteria for another reason')});
    } else { // mild, but admitted or vomiting -> maintenance + deficit over 24h, no bolus (dehydration itself is only mild)
      doseLines.push({name:'IV fluid (maintenance + deficit)', dose:{th:'ให้รวมกันทางหลอดเลือดดำให้ครบใน 24 ชั่วโมง — ไม่จำเป็นต้องให้ bolus เนื่องจากขาดน้ำเพียงเล็กน้อย', en:'Give combined, IV, over 24 hours — no bolus needed since the dehydration itself is only mild'}});
      extraLines.push({th:'เลือกชนิดสารน้ำตามอายุและระดับโซเดียมในเลือด (ดูหัวข้อด้านล่าง)', en:'Fluid type chosen by age and serum sodium (see below)'});
      extraLines.push({th:'สาเหตุที่ต้องให้ IV: ' + (vomitLimits ? 'อาเจียนรบกวนการดื่ม ORS' : 'เข้าเกณฑ์รับไว้ในโรงพยาบาลจากข้อบ่งชี้อื่น'), en:'Reason for IV: ' + (vomitLimits ? 'vomiting limits oral intake' : 'meets admission criteria for another reason')});
    }
    rehy = { icon: shock ? '🚨' : '💉',
      h: shock ? {th:'ภาวะช็อก — ให้สารน้ำทางหลอดเลือดดำทันที',en:'Shock — immediate IV fluids'}
         : {th:`${t(DR.tierTitle[dehydration])} — ให้สารน้ำทางหลอดเลือดดำ`, en:`${t(DR.tierTitle[dehydration])} — IV fluids`},
      prominent:true, severityTag:dehydration==='severe'||shock?'severe':dehydration,
      drugs:doseLines, extra:extraLines };
  } else {
    rehy = { icon: dehydration==='moderate' ? '🥤' : '🏠',
      h: {th:`${t(DR.tierTitle[dehydration])} — สารน้ำทางปาก (ORS)`, en:`${t(DR.tierTitle[dehydration])} — oral rehydration (ORS)`},
      prominent:true, severityTag:dehydration,
      drugs:[ {name:'Reduced-osmolality ORS', dose:{th:`${deficit.mlkg} มล./กก. ภายใน 4 ชั่วโมง (ปริมาณสำหรับ${ageLabel}) ให้ทีละน้อยแต่บ่อยครั้ง`, en:`${deficit.mlkg} mL/kg over 4 hours (dosed for ${ageLabel}), small frequent amounts`}} ],
      extra:[ deficitNote, {th:'กินอาหาร/นมได้ตามปกติระหว่างแก้ไขภาวะขาดน้ำ ไม่ต้องงดอาหาร', en:'Continue normal feeding while rehydrating — no need to fast'} ] };
  }

  const sections = [ rehy ];

  // ---------- Fluid type / electrolyte correction (collapsible detail tied to the IV plan) ----------
  if(needsIV){
    sections.push({ icon:'🧪', h:{th:'ชนิดสารน้ำ (Subsequent fluid) และการแก้ไขอิเล็กโทรไลต์',en:'Subsequent fluid type and electrolyte correction'}, collapsible:true, openByDefault:false,
      customHtml: drFluidTypeTableHtml() + `<ul style="margin-top:12px;">
        <li>${t({th:'เมื่อผู้ป่วยเริ่มปัสสาวะออกดี เติม 15%KCl (20 มิลลิโมล/10 มล.) ให้มี K เริ่มต้น 20 มิลลิโมล/ลิตร ยกเว้นมี serum K &gt; 5.5 mmol/L และควรคำนวณอัตราการได้รับ K ไม่ให้เกิน 0.15 มิลลิโมล/กก./ชม.',
          en:'Once urinating well, add 15%KCl (20 mmol/10 mL) for an initial K concentration of 20 mmol/L, unless serum K &gt; 5.5 mmol/L — cap the K infusion rate at 0.15 mmol/kg/hr'})}</li>
      </ul>
      <div style="margin:10px 0; border:1.5px solid var(--pink-300); border-radius:10px; padding:10px 12px; background:var(--pink-50);">
        <div style="font-size:12.5px; font-weight:600; color:var(--pink-600); margin-bottom:4px;">${t({th:'แก้ไข acute metabolic acidosis (เมื่อ serum TCO2 &lt;10 mmol/L)', en:'Correcting acute metabolic acidosis (when serum TCO2 &lt;10 mmol/L)'})}</div>
        <div style="font-size:12.5px; line-height:1.6; color:var(--ink);">${t({th:'เจือจาง 7.5%NaHCO3 ด้วย 5%D water ให้ปริมาตรรวมเป็น 6 เท่าของปริมาณ NaHCO3 (Na สุดท้าย ≈ NSS) หยดทาง IV นาน 4–6 ชั่วโมง', en:'Dilute the 7.5% NaHCO3 with 5%D water to 6× its volume (final Na ≈ NSS) and infuse IV over 4–6 hours'})}</div>
        <div style="margin-top:8px; padding:8px 10px; background:white; border:1px dashed var(--pink-300); border-radius:8px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink);">
          ${t({th:'สูตรคำนวณ: Bicarbonate (mmol) = 0.5 × น้ำหนักตัว (กก.) × (10 − TCO2 ที่วัดได้)', en:'Formula: Bicarbonate (mmol) = 0.5 × body weight (kg) × (10 − measured TCO2)'})}
        </div>
      </div>
      <ul>
        <li>${t({th:'ควรตรวจ serum electrolytes, BUN และ Cr ในผู้ป่วยที่ต้องได้รับ IV fluid ทุกราย และประเมินซ้ำที่ 48 ชั่วโมงหลังเริ่มการรักษา แต่ในรายที่ผลแรกรับผิดปกติจนต้องแก้ไข ควรตรวจซ้ำภายใน 6–12 ชั่วโมง (ไม่ต้องตรวจ BUN/Cr ซ้ำถ้าผลเบื้องต้นปกติ)',
          en:'Check serum electrolytes, BUN, and Cr in all patients requiring IV fluids, and recheck at 48 hours after starting treatment; if the initial result was abnormal and required correction, recheck within 6–12 hours instead (BUN/Cr need not be repeated if initially normal)'})}</li>
      </ul>` });
  }

  // ---------- 2. Concurrent-loss replacement fluid — applies while diarrhea continues, all tiers ----------
  sections.push({ icon:'🔄', h:{th:'สารน้ำทดแทนการสูญเสียที่ยังดำเนินอยู่ (concurrent loss)',en:'Replacement fluid for ongoing (concurrent) losses'}, drugs:[
    {name:'Reduced-osmolality ORS', dose:{th:'10 มล./กก. ต่อการถ่ายเหลว 1 ครั้ง (สูงสุด 240 มล./ครั้ง) ให้หมดภายใน 1–2 ชั่วโมง โดยใช้ช้อนตักป้อนหรือค่อย ๆ จิบ', en:'10 mL/kg per loose stool (max 240 mL/dose), given over 1–2 hours by spoon-feeding or sipping'}}
  ] });

  // ---------- Admission notice ----------
  if(admitNeeded){
    sections.push({ icon:'🏥', h:{th:'ควรรับไว้รักษาในโรงพยาบาล',en:'Hospital admission recommended'}, list:[
      {th:'เข้าเกณฑ์อย่างน้อย 1 ข้อ: ขาดน้ำรุนแรง/ช็อก, สงสัยติดเชื้อในกระแสเลือด, อาเจียนรุนแรง, อาเจียนมีน้ำดี/สงสัยศัลยกรรม, ความผิดปกติทางระบบประสาท หรือแพทย์พิจารณาว่าเสี่ยง', en:'Meets at least one criterion: severe dehydration/shock, suspected bacteremia, severe vomiting, bilious vomiting/surgical concern, neurological abnormality, or physician judges risk too high'} ] });
  }

  // ---------- 3. Antibiotics (prominent if indicated) + organism reference table ----------
  const bloodyStool = drState.stool==='bloody';
  const infantU3moBloody = bloodyStool && under3mo;
  const invasiveCriterion = drState.abxrisk.includes('invasive') && bloodyStool;
  const empiricalIndicated = drState.abxrisk.includes('cholera') || invasiveCriterion || infantU3moBloody || drState.abxrisk.includes('immunocompromised') || drState.danger.includes('sepsis');

  let abxSection;
  if(empiricalIndicated){
    const severeAbx = drState.danger.includes('sepsis') || drState.danger.includes('shock') || under3mo || drState.abxrisk.includes('immunocompromised');
    if(severeAbx){
      abxSection = { icon:'💉', h:{th:'ยาปฏิชีวนะแบบครอบคลุม (ทางหลอดเลือดดำ)',en:'Empirical antibiotics (IV)'}, prominent:true, drugs:[
        {name:'Ceftriaxone', dose:{th:'50–100 มก./กก./วัน ทางหลอดเลือดดำ นาน 3–5 วัน', en:'50–100 mg/kg/day IV for 3–5 days'}}
      ], extra:[
        under3mo
          ? {th:'ทารกอายุน้อยกว่า 3 เดือน: แนะนำ ceftriaxone ทางหลอดเลือดดำเป็นยาหลักเมื่อจำเป็นต้องได้ยาปฏิชีวนะ (หลีกเลี่ยงยากลุ่ม fluoroquinolone ชนิดกินในกลุ่มอายุนี้)', en:'Age under 3 months: ceftriaxone IV is the recommended first-line agent whenever antibiotics are indicated (avoid oral fluoroquinolones in this age group)'}
          : {th:'ข้อบ่งชี้: สงสัยติดเชื้อในกระแสเลือด/ภาวะรุนแรง, ทารกอายุ <3 เดือน, ภูมิคุ้มกันบกพร่อง หรือกินยาไม่ได้', en:'Indications: suspected bacteremia/severe illness, infant <3 months, immunocompromised, or unable to take oral medication'},
        {th:'ปรับยาตามผลเพาะเชื้อในอุจจาระหรือในเลือดเมื่อทราบผล', en:'Adjust based on stool or blood culture results once available'}
      ] };
    } else {
      abxSection = { icon:'💊', h:{th:'ยาปฏิชีวนะแบบครอบคลุม (ชนิดกิน)',en:'Empirical antibiotics (oral)'}, prominent:true, drugs:[
        {name:'Ciprofloxacin', dose:{th:'20 มก./กก./วัน แบ่งวันละ 2 ครั้ง นาน 3–5 วัน', en:'20 mg/kg/day divided BID for 3–5 days'}},
        {name:'หรือ Norfloxacin', dose:{th:'15–20 มก./กก./วัน แบ่งวันละ 2 ครั้ง นาน 3–5 วัน', en:'15–20 mg/kg/day divided BID for 3–5 days'}}
      ], extra:[{th:'ปรับยาตามผลเพาะเชื้อในอุจจาระหรือในเลือดเมื่อทราบผล — ทั้งสองตัวมีเฉพาะรูปแบบเม็ด หากเด็กยังกลืนยาเม็ดไม่ได้ ดูตารางยาตามเชื้อที่สงสัยด้านล่างสำหรับทางเลือกที่มีรูปแบบยาน้ำ', en:'Adjust based on stool or blood culture results once available — both are tablet-only; if the child cannot yet swallow tablets, see the organism-specific table below for suspension-based alternatives'}] };
    }
  } else {
    abxSection = { icon:'🚫', h:{th:'ยาปฏิชีวนะ',en:'Antibiotics'}, list:[
      {th:'ไม่มีข้อบ่งชี้ให้ยาปฏิชีวนะแบบครอบคลุมในขณะนี้ — การให้ยาปฏิชีวนะเป็นประจำในผู้ป่วยท้องร่วงเฉียบพลันทุกรายไม่แนะนำ', en:'No current indication for empirical antibiotics — routine antibiotic use in all acute diarrhea patients is not recommended'} ] };
  }
  sections.push(abxSection);

  if(empiricalIndicated){
    sections.push({ icon:'📋', h:{th:'ตารางยาปฏิชีวนะตามเชื้อที่สงสัย (อ้างอิงเพิ่มเติม)',en:'Antibiotic choice by suspected organism (additional reference)'},
      collapsible:true, openByDefault:false,
      customHtml: drAbxOrganismTableHtml() });
  }

  // ---------- Stool culture indications ----------
  sections.push({ icon:'🔬', h:{th:'ข้อบ่งชี้การส่งตรวจอุจจาระ',en:'Stool testing indications'}, list:[
    {th:'มีโรคประจำตัวเรื้อรังหรือภูมิคุ้มกันบกพร่อง · ทารกอายุน้อยกว่า 6 เดือน · อาการรุนแรง', en:'Chronic disease/immunodeficiency · infant under 6 months · severe symptoms'},
    {th:'สงสัยติดเชื้อในกระแสเลือด · สงสัยติดเชื้อ Vibrio cholerae · อาการไม่ดีขึ้นภายใน 7 วัน', en:'Suspected bacteremia · suspected Vibrio cholerae · not improving within 7 days'},
    {th:'ประวัติเดินทางไปพื้นที่เสี่ยง หรืออยู่ในช่วงที่มีการระบาด', en:'Travel history to at-risk areas, or during an outbreak period'}
  ] });

  // ---------- Antiemetic ----------
  if(vomitLimits){
    if(!under6mo){
      sections.push({ icon:'🤢', h:{th:'ยาแก้อาเจียน',en:'Antiemetic'}, drugs:[
        {name:'Ondansetron', dose:{th:'0.1–0.2 มก./กก./ครั้ง (สูงสุด 8 มก.) กินหรือฉีด ครั้งเดียว', en:'0.1–0.2 mg/kg/dose (max 8 mg) PO or IV, single dose'}}
      ], extra:[{th:'อาจทำให้ถ่ายอุจจาระบ่อยขึ้นเล็กน้อย และมีความเสี่ยงต่อ QT prolongation หากให้ซ้ำหลายครั้ง', en:'May slightly increase stool frequency; risk of QT prolongation with repeated dosing'}] });
    } else {
      sections.push({ icon:'🤢', h:{th:'ยาแก้อาเจียน',en:'Antiemetic'}, list:[
        {th:'Ondansetron แนะนำเฉพาะอายุ ≥6 เดือน — ในเด็กอายุน้อยกว่านี้ยังไม่มีข้อมูลเพียงพอ ควรเน้นการให้สารน้ำทีละน้อยบ่อยครั้งแทน', en:'Ondansetron is recommended only for age ≥6 months — for younger infants, focus on small frequent oral fluids instead'} ] });
    }
  }

  // ---------- Nutrition & adjunct therapy — pushed to the end, collapsed by default ----------
  sections.push({ icon:'🍼', h:{th:'การให้อาหาร',en:'Nutrition'}, collapsible:true, openByDefault:false, list:[
    {th:'ทารกที่กินนมแม่ ให้กินนมแม่ต่อได้แม้ขณะกำลังแก้ไขภาวะขาดน้ำ', en:'Breastfed infants should continue breastfeeding even while rehydrating'},
    {th:'ทารกที่กินนมผสม/อาหารตามวัย เริ่มกินได้ภายใน 4–6 ชม. หลังเริ่มแก้ไขภาวะขาดน้ำ ไม่ต้องเจือจางนม', en:'Formula/food-fed infants may resume within 4–6h of starting rehydration; no need to dilute formula'},
    {th:'ไม่จำเป็นต้องเปลี่ยนเป็นนมสูตรปราศจากแล็กโทสทุกราย ยกเว้นถ่ายเป็นน้ำรุนแรงที่สงสัย lactose intolerance หรือรับไว้ในโรงพยาบาล', en:'Lactose-free formula is not routinely needed, except for severe watery diarrhea with suspected lactose intolerance, or hospitalized infants'},
    {th:'กินอาหารตามวัยที่ย่อยง่าย ปริมาณน้อยแต่บ่อยครั้ง งดเครื่องดื่มที่มีน้ำตาลสูง', en:'Easy-to-digest, age-appropriate food in small frequent portions; avoid high-sugar drinks'}
  ] });

  sections.push({ icon:'💊', h:{th:'การรักษาเสริม (พิจารณาเป็นราย ๆ ไป)',en:'Adjunct therapy (consider case-by-case)'}, collapsible:true, openByDefault:false,
    customHtml: drAdjunctTableHtml(under6mo) });

  let sev = (shock || dehydration==='severe') ? 'severe' : (dehydration==='moderate' || admitNeeded) ? 'moderate' : 'mild';

  const title = shock ? {th:'ภาวะช็อกจากท้องร่วง — ฉุกเฉิน',en:'Diarrhea with shock — emergency'} : DR.tierTitle[dehydration];
  const summary = { th:`ประเมินจากอาการแสดง (${ageLabel}, CDC scale) ${admitNeeded ? '— เข้าเกณฑ์รับไว้ในโรงพยาบาล' : '— อาจรักษาแบบผู้ป่วยนอกได้หากติดตามอาการได้'}`,
                     en:`Based on clinical signs (${ageLabel}, CDC scale) ${admitNeeded ? '— meets hospital admission criteria' : '— outpatient management possible with reliable follow-up'}` };

  return { severity:sev, title, summary, sections };
}

function drResultView(app){
  drHeader(app, t(DR.refBadge));
  const wrap = document.createElement('div');
  const result = drCompute();

  const banner = document.createElement('div');
  banner.className = `result-banner ${result.severity}`;
  banner.innerHTML = `<h2>${t(result.title)}</h2><p>${t(result.summary)}</p>`;
  wrap.appendChild(banner);

  (result.sections||[]).forEach(sec=>{
    const sc = document.createElement('div');
    sc.className = sec.prominent ? 'section-card prominent' : 'section-card';
    let body = sec.customHtml || '';
    if(sec.drugs && sec.drugs.length){ body += sec.drugs.map(d=>`<div class="drugline"><span class="dname">${d.name}</span><span class="ddose">${t(d.dose)}</span></div>`).join(''); }
    if(sec.extra && sec.extra.length){ body += `<ul>${sec.extra.map(e=>`<li>${t(e)}</li>`).join('')}</ul>`; }
    if(sec.list && sec.list.length){ body += `<ul>${sec.list.map(e=>`<li>${t(e)}</li>`).join('')}</ul>`; }
    if(sec.collapsible){
      sc.innerHTML = `<details ${sec.openByDefault?'open':''}>
        <summary style="cursor:pointer; font-size:13.5px; font-weight:600; color:var(--pink-600); list-style:none; display:flex; align-items:center; gap:7px;">${sec.icon||''} ${t(sec.h)} <span style="margin-left:auto; font-size:11px; color:var(--ink-soft); font-weight:400;">${LANG==='th'?'แตะเพื่อดูรายละเอียด':'tap for details'}</span></summary>
        <div style="margin-top:10px;">${body}</div>
      </details>`;
    } else {
      const headSize = sec.prominent ? '15px' : '13.5px';
      sc.innerHTML = `<h3 style="font-size:${headSize};">${sec.icon||''} ${t(sec.h)}</h3>${body}`;
    }
    wrap.appendChild(sc);
  });

  const restart = document.createElement('button');
  restart.className='restart-btn';
  restart.textContent = t(UI.restart);
  restart.onclick = ()=>{ drResetAll(); scrollToTop(); render(); };
  wrap.appendChild(restart);

  const ref = document.createElement('div');
  ref.className='ref-note';
  ref.textContent = t(DR.refFooter);
  wrap.appendChild(ref);

  app.appendChild(wrap);
}

/* ============================================================================
   MENINGOENCEPHALITIS MODULE (MG)
   Reference: CPG of Acute Meningoencephalitis 2557 (PIDST) — Chart 1, Tables 2-6
              + WHO guidelines on meningitis diagnosis, treatment and care, 2025 (dexamethasone)
   ============================================================================ */
